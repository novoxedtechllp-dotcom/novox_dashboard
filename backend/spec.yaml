openapi: 3.0.3
info:
  title: Novox EdTech Dashboard API
  description: |
    ## Overview
    The **Novox Dashboard API** is the complete backend for the Novox EdTech institute management
    platform. It handles every operational aspect of the institute — from student onboarding and
    course delivery to HR, payroll, fee collection, CRM leads, and content publishing.

    ## Authentication
    Most endpoints require a valid **JWT Bearer token** obtained via `POST /api/v1/auth/login`.
    Include it in every protected request header:
    ```
    Authorization: Bearer <your_access_token>
    ```
    On login, a `refreshToken` is also set as an **HttpOnly cookie** for session persistence.

    ## Role-Based Access Control (RBAC)
    Every endpoint is protected by one of three top-level roles:

    | Role | Description |
    |------|-------------|
    | `ADMIN` | Full access to all resources. Can create/delete users, process payroll, approve leaves, etc. |
    | `EMPLOYEE` | Scoped access. Must also have a sub-role: `SALES`, `MARKETING`, `HR`, `DEVELOPMENT`, `DESIGN`, or `ACCOUNTS`. HR employees can manage other employees. |
    | `STUDENT` | Read/write access to their own profile, progress, tasks, and fees only. |

    ## Standard Response Envelope
    Every response, success or error, follows this consistent shape:
    ```json
    {
      "statusCode": 200,
      "data": { "..." },
      "message": "Human-readable status message",
      "success": true
    }
    ```
    Error responses:
    ```json
    {
      "success": false,
      "statusCode": 400,
      "message": "Validation failed",
      "errors": ["field-specific error details"]
    }
    ```
  version: 1.0.0
  contact:
    name: Novox EdTech LLP
    url: https://novoxedtechllp.com

servers:
  - url: http://localhost:5000
    description: Local development server (default port 5000)
  - url: https://api.novoxedtech.com
    description: Production server

tags:
  - name: Health
    description: Lightweight ping to confirm the server is alive. Used by keep-alive cron jobs to prevent cold-starts on free hosting tiers.
  - name: Auth
    description: |
      Core authentication flows. Handles **registration** (student self-signup), **login** (all roles),
      **logout**, reading the **current session user**, and **changing password**.
  - name: Users
    description: |
      Low-level system user account management. This is separate from the Student/Employee profile layers.
      A "User" is the auth identity (email + role + status). **Admin only**.
  - name: Students
    description: |
      Full student lifecycle management — enrolment, profile, assigned courses, task tracking,
      academic progress, document storage, mentoring sessions, and daily study plans.
  - name: Employees
    description: |
      HR management for institute staff. Covers onboarding, profile updates, document management,
      course instructor assignments, teaching schedules, mentoring sessions, and daily work plans.
  - name: Courses
    description: |
      Complete course content management. Courses have a 4-level nested structure:
      **Course → Module → Submodule → Task → Subtask**.
      Includes scheduling (auto and manual), batch student assignment, and instructor management.
  - name: Attendance
    description: |
      Attendance tracking for both students and employees. Supports manual marking, bulk operations,
      and employee self-service check-in/check-out with timestamp logging.
  - name: Fees
    description: |
      Student fee lifecycle — creating fee plans, recording installment payments, tracking outstanding
      balances with automatic carry-forward logic, and dashboard summaries.
  - name: Leads
    description: |
      CRM pipeline for prospective students. Leads move through stages (NEW → CONTACTED → QUALIFIED →
      PROPOSAL → CLOSED_WON/LOST). Includes activity logging, source tracking, and salesperson performance.
  - name: Leaves
    description: Leave request management for employees and students. Supports multi-day applications, leave types (Sick/Casual/Earned/Unpaid), and Admin approval workflow.
  - name: Payroll
    description: Monthly payroll processing for employees. Calculates net salary from base pay, attendance deductions, and leave adjustments. Generates per-employee payslip history.
  - name: Work Reports
    description: Daily work log submissions by employees. Admins can view all reports for productivity tracking and performance reviews.
  - name: Roles
    description: Custom roles and fine-grained permission management. Allows defining named roles with specific resource-level permissions beyond the three built-in roles.
  - name: Profile
    description: The logged-in user's own profile — view and update personal details and upload a profile avatar. Works across all roles (Admin, Employee, Student).
  - name: Upload
    description: Single-file upload utility backed by Cloudinary. Returns the hosted URL to be used in other endpoints (e.g., student documents, employee documents, gallery images).
  - name: Gallery
    description: Media asset management for the institute's public-facing websites. Organises images by category and website. Powered by Cloudinary. Public read, Admin-only write.
  - name: Blogs
    description: AI-powered blog content generation and publishing. Generates full drafts and cover images from a topic prompt, then publishes to connected platforms.
  - name: Settings
    description: Company-wide configuration (working hours, leave limits, attendance grace period). Readable by Admin and Employee; writable by Admin only.

# ─────────────────────────────────────────────
# Reusable Components
# ─────────────────────────────────────────────
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token. Obtain it from `POST /api/v1/auth/login`. Expires per ACCESS_TOKEN_EXPIRY env setting.

  schemas:
    # ── Generic ─────────────────────────────────
    ApiResponse:
      type: object
      description: Standard success response envelope used by all endpoints.
      properties:
        statusCode:
          type: integer
          example: 200
        data:
          description: The actual response payload. Shape varies per endpoint — refer to each endpoint's example.
        message:
          type: string
          example: "Operation successful"
        success:
          type: boolean
          example: true

    ApiError:
      type: object
      description: Standard error envelope returned for all 4xx and 5xx responses.
      properties:
        success:
          type: boolean
          example: false
        statusCode:
          type: integer
          example: 400
        message:
          type: string
          example: "Validation error"
        errors:
          type: array
          description: Field-level error details (populated for validation failures).
          items:
            type: string

    # ── Auth / Users ────────────────────────────
    UserObject:
      type: object
      description: The base authentication identity. Every person (Admin, Employee, Student) has one User record.
      properties:
        id:
          type: string
          format: uuid
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        email:
          type: string
          format: email
          example: "admin@novox.com"
        role:
          type: string
          enum: [ADMIN, EMPLOYEE, STUDENT]
          example: "ADMIN"
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
          description: INACTIVE users cannot log in.
          example: "ACTIVE"
        last_login:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: "admin@novox.com"
        password:
          type: string
          format: password
          example: "SecurePass@123"

    RegisterRequest:
      type: object
      required: [email, password]
      description: Student self-registration. Only STUDENT accounts can be created this way.
      properties:
        email:
          type: string
          format: email
          example: "student@novox.com"
        password:
          type: string
          format: password
          example: "Password@123"
        first_name:
          type: string
          example: "Raj"
        last_name:
          type: string
          example: "Sharma"

    ChangePasswordRequest:
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword:
          type: string
          description: The user's current password, used to verify identity before changing.
          example: "OldPass@123"
        newPassword:
          type: string
          description: The new password to set. Should meet your security policy requirements.
          example: "NewPass@456"

    CreateUserRequest:
      type: object
      required: [email, password, role]
      description: Creates a bare user account. For Employee or Student, also create the corresponding profile record via /employees or /students.
      properties:
        email:
          type: string
          format: email
          example: "hr@novox.com"
        password:
          type: string
          description: Initial password. A welcome email with these credentials is sent to the user automatically.
          example: "HrPass@123"
        role:
          type: string
          enum: [ADMIN, EMPLOYEE, STUDENT]
          example: "EMPLOYEE"
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
          default: ACTIVE
          description: Set to INACTIVE to create an account that cannot log in yet.

    UpdateUserRequest:
      type: object
      description: Partial update — send only the fields you want to change.
      properties:
        email:
          type: string
          format: email
          description: Update the user's login email address.
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
          description: Toggle INACTIVE to suspend a user without deleting their data.
        role:
          type: string
          enum: [ADMIN, EMPLOYEE, STUDENT]
          description: Change the user's system role. Use carefully — this affects all access permissions.

    # ── Student ────────────────────────────────
    StudentObject:
      type: object
      description: A student's profile record, linked to a User account. Contains personal and academic info.
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
          description: Reference to the linked User account (auth identity).
        first_name:
          type: string
          example: "Ananya"
        last_name:
          type: string
          example: "Patel"
        phone:
          type: string
          example: "+91-9876543210"
        date_of_birth:
          type: string
          format: date
        address:
          type: string
        profile_pic_url:
          type: string
          format: uri
          nullable: true
        status:
          type: string
          enum: [ACTIVE, INACTIVE, COMPLETED]
          description: COMPLETED means the student has finished their course program.
        created_at:
          type: string
          format: date-time

    CreateStudentRequest:
      type: object
      required: [first_name, last_name, email, password]
      description: Creates both a User auth account and a Student profile in one atomic operation. A welcome email is sent.
      properties:
        first_name:
          type: string
          example: "Ananya"
        last_name:
          type: string
          example: "Patel"
        email:
          type: string
          format: email
          example: "ananya@example.com"
        password:
          type: string
          description: Login password for the student's account.
          example: "StudentPass@1"
        phone:
          type: string
          example: "+91-9876543210"
        date_of_birth:
          type: string
          format: date
          example: "2002-05-15"
        address:
          type: string
          example: "42, MG Road, Pune"

    AssignCourseRequest:
      type: object
      required: [course_id]
      description: Enrols a student into a specific course. Triggers automatic task and schedule generation.
      properties:
        course_id:
          type: string
          format: uuid
          example: "6b53bb61-2de7-403d-b7ac-a53ad6143ad6"
        start_date:
          type: string
          format: date
          description: The date from which this student's course schedule begins. Defaults to today if omitted.
          example: "2026-08-01"

    # ── Employee ───────────────────────────────
    EmployeeObject:
      type: object
      description: An employee's HR profile record, linked to a User account. Includes role, salary, and department info.
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
          description: Reference to the linked User account.
        first_name:
          type: string
          example: "Vikram"
        last_name:
          type: string
          example: "Singh"
        employee_role:
          type: string
          enum: [SALES, MARKETING, HR, DEVELOPMENT, DESIGN, ACCOUNTS]
          description: The functional department of this employee. HR employees get extra management privileges.
          example: "HR"
        phone:
          type: string
          example: "+91-9123456789"
        department:
          type: string
        salary:
          type: number
          format: float
          description: Monthly gross salary in INR. Used by the payroll module.
          example: 45000.00
        join_date:
          type: string
          format: date
        status:
          type: string
          enum: [ACTIVE, INACTIVE]

    CreateEmployeeRequest:
      type: object
      required: [first_name, last_name, email, password, employee_role]
      description: Creates both a User auth account and an Employee profile. A welcome email with credentials is sent automatically.
      properties:
        first_name:
          type: string
          example: "Vikram"
        last_name:
          type: string
          example: "Singh"
        email:
          type: string
          format: email
          example: "vikram@novox.com"
        password:
          type: string
          example: "EmpPass@123"
        employee_role:
          type: string
          enum: [SALES, MARKETING, HR, DEVELOPMENT, DESIGN, ACCOUNTS]
          description: Determines the employee's functional department and system permissions.
          example: "HR"
        phone:
          type: string
          example: "+91-9123456789"
        salary:
          type: number
          description: Monthly gross salary in INR.
          example: 45000
        join_date:
          type: string
          format: date
          example: "2026-01-15"
        department:
          type: string
          example: "Human Resources"

    CreateMentoringSessionRequest:
      type: object
      required: [student_id, session_date, topic]
      description: Schedules a one-on-one mentoring session between an employee (mentor) and a student.
      properties:
        student_id:
          type: string
          format: uuid
          description: The student this session is for.
        session_date:
          type: string
          format: date-time
          example: "2026-08-10T10:00:00Z"
        topic:
          type: string
          description: The subject or agenda for the session.
          example: "React Hooks Deep Dive"
        notes:
          type: string
          description: Any prep notes or agenda details the mentor wants to record.

    # ── Course ─────────────────────────────────
    CourseObject:
      type: object
      description: A course offering at the institute. Can be in DRAFT (being built), PUBLISHED (student-visible), or ARCHIVED state.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "Full Stack Web Development"
        description:
          type: string
        duration_months:
          type: integer
          example: 6
        status:
          type: string
          enum: [DRAFT, PUBLISHED, ARCHIVED]
          example: "PUBLISHED"
        fee:
          type: number
          description: Total course fee in INR. Used as the default when creating a fee plan.
          example: 125000
        created_at:
          type: string
          format: date-time

    CreateCourseRequest:
      type: object
      required: [name]
      description: Creates a new course in DRAFT status. Add modules/submodules/tasks next, then publish.
      properties:
        name:
          type: string
          example: "Full Stack Web Development"
        description:
          type: string
          example: "A comprehensive 6-month program covering React, Node.js, and PostgreSQL."
        duration_months:
          type: integer
          example: 6
        fee:
          type: number
          description: Standard course fee in INR. Used as the default when creating fee plans for enrolled students.
          example: 125000

    CreateModuleRequest:
      type: object
      required: [title]
      description: A module is the top-level chapter of a course (e.g., "Module 1 - JavaScript Fundamentals").
      properties:
        title:
          type: string
          example: "Module 1: JavaScript Fundamentals"
        description:
          type: string
        order:
          type: integer
          description: Display position within the course. Lower number = shown first.
          example: 1

    CreateSubmoduleRequest:
      type: object
      required: [title]
      description: A submodule is a specific topic within a module (e.g., "Variables & Data Types"). It's the scheduling unit — each submodule gets a teaching slot.
      properties:
        title:
          type: string
          example: "Variables & Data Types"
        description:
          type: string
        order:
          type: integer
          description: Display position within the parent module.
          example: 1
        duration_hours:
          type: number
          description: Estimated time to teach this submodule. Used by the auto-scheduler.
          example: 2.5

    CreateTaskRequest:
      type: object
      required: [title]
      description: A task is a practical assignment given to students within a submodule (e.g., "Build a Todo App").
      properties:
        title:
          type: string
          example: "Build a Todo App"
        description:
          type: string
          description: Detailed instructions, acceptance criteria, and reference links for the student.
        due_days:
          type: integer
          description: Number of days from assignment to submission deadline.
          example: 3
        order:
          type: integer
          example: 1

    # ── Attendance ─────────────────────────────
    MarkAttendanceRequest:
      type: object
      required: [user_id, date, status]
      description: Records attendance status for a single user on a specific date.
      properties:
        user_id:
          type: string
          format: uuid
          description: The User ID of the student or employee being marked.
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        date:
          type: string
          format: date
          example: "2026-07-18"
        status:
          type: string
          enum: [PRESENT, ABSENT, LATE, HALF_DAY, ON_LEAVE]
          description: |
            - PRESENT: Full attendance
            - LATE: Arrived after the grace period (configured in Settings)
            - HALF_DAY: Present for only part of the day
            - ON_LEAVE: Linked to an approved leave request
          example: "PRESENT"
        note:
          type: string
          description: Optional context (e.g., "Student joined 20 mins late due to transport issue").
          example: "Arrived 15 minutes late"

    BulkAttendanceRequest:
      type: object
      required: [date, records]
      description: Mark attendance for multiple users in a single API call. Used to process an entire batch or class at once.
      properties:
        date:
          type: string
          format: date
          description: The date for which attendance is being marked for all records.
          example: "2026-07-18"
        records:
          type: array
          description: Array of individual attendance entries.
          items:
            type: object
            properties:
              user_id:
                type: string
                format: uuid
              status:
                type: string
                enum: [PRESENT, ABSENT, LATE, HALF_DAY, ON_LEAVE]

    # ── Fees ───────────────────────────────────
    FeePlanObject:
      type: object
      description: A fee plan defines the payment schedule for a student enrolled in a course. It tracks the total fee, discount, admission fee, and monthly installment amount.
      properties:
        id:
          type: string
          format: uuid
          example: "1c501242-d7f1-47b4-9a0b-cdc039992e60"
        student_id:
          type: string
          format: uuid
        course_id:
          type: string
          format: uuid
        total_fee:
          type: number
          example: 125000
        discount:
          type: number
          description: Discount applied to the total fee (in INR).
          example: 0
        final_fee:
          type: number
          description: Auto-calculated as total_fee - discount.
          example: 125000
        admission_fee:
          type: number
          description: One-time fee paid at the time of enrollment.
          example: 5000
        monthly_installment:
          type: number
          description: Expected monthly payment amount.
          example: 10000
        start_month:
          type: integer
          description: The month (1-12) from which installments begin.
          example: 6
        start_year:
          type: integer
          example: 2026
        created_at:
          type: string
          format: date-time

    CreateFeePlanRequest:
      type: object
      required: [student_id, course_id, admission_fee, monthly_installment, total_fee]
      description: |
        Creates a structured fee plan for a student's course enrollment.
        `final_fee` is auto-calculated as `total_fee - discount`.
        The `start_month` and `start_year` default to the current month/year.
      properties:
        student_id:
          type: string
          format: uuid
          example: "f9c48f63-7c26-4822-aa54-a9108097e64f"
        course_id:
          type: string
          format: uuid
          example: "6b53bb61-2de7-403d-b7ac-a53ad6143ad6"
        admission_fee:
          type: number
          description: One-time registration/admission fee collected at enrollment.
          example: 5000
        monthly_installment:
          type: number
          description: The recurring amount due each month.
          example: 10000
        total_fee:
          type: number
          description: Gross total course fee before any discount.
          example: 125000
        discount:
          type: number
          description: Discount amount to be deducted from total_fee. Defaults to 0.
          default: 0
          example: 0

    RecordPaymentRequest:
      type: object
      required: [student_id, fee_plan_id, amount, payment_method, payment_type, month, year]
      description: |
        Records a payment made by or on behalf of a student.
        The system **automatically handles carry-forward logic** — if a student pays less than
        the installment amount, the shortfall is carried forward to the next month's due amount.
      properties:
        student_id:
          type: string
          format: uuid
          example: "f9c48f63-7c26-4822-aa54-a9108097e64f"
        fee_plan_id:
          type: string
          format: uuid
          description: The specific fee plan this payment is against.
          example: "1c501242-d7f1-47b4-9a0b-cdc039992e60"
        amount:
          type: number
          description: The actual amount received (can be partial).
          example: 7000
        payment_method:
          type: string
          enum: [CASH, UPI, CARD, BANK]
          description: Mode of payment used by the student.
          example: "UPI"
        payment_type:
          type: string
          enum: [ADMISSION, INSTALLMENT, FULL, PARTIAL]
          description: |
            - ADMISSION: First payment at enrollment (admission fee)
            - INSTALLMENT: Regular monthly payment
            - FULL: Complete remaining balance paid at once
            - PARTIAL: Partial payment towards current month's due
          example: "INSTALLMENT"
        month:
          type: integer
          minimum: 1
          maximum: 12
          description: The billing month this payment is for (1=January, 12=December).
          example: 6
        year:
          type: integer
          example: 2026
        transaction_reference:
          type: string
          nullable: true
          description: UPI transaction ID, bank reference, or any external reference number.
        notes:
          type: string
          nullable: true
          description: Any additional note about this payment (e.g., "Paid via family member's account").

    # ── Lead ───────────────────────────────────
    LeadObject:
      type: object
      description: A CRM lead represents a prospective student who has shown interest in a course. Leads move through a sales pipeline until they are converted (CLOSED_WON) or lost.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "Rahul Mehta"
        phone:
          type: string
          example: "+91-9988776655"
        email:
          type: string
          format: email
          nullable: true
        source_id:
          type: string
          format: uuid
          description: Reference to the lead_sources table (e.g., Instagram, Website).
        course_id:
          type: string
          format: uuid
          nullable: true
          description: The course the lead is interested in.
        course:
          type: string
          description: Resolved course name for display.
          example: "Full Stack Web Development"
        stage:
          type: string
          enum: [NEW, CONTACTED, QUALIFIED, PROPOSAL, CLOSED_WON, CLOSED_LOST]
          description: |
            The lead's current position in the sales funnel:
            - NEW: Just captured, not yet contacted
            - CONTACTED: Initial conversation has happened
            - QUALIFIED: Confirmed interest and budget
            - PROPOSAL: Pricing/schedule sent
            - CLOSED_WON: Converted to a student
            - CLOSED_LOST: Did not convert
          example: "NEW"
        hot:
          type: boolean
          description: Flagged as a high-priority/hot lead that needs immediate follow-up.
          example: false
        note:
          type: string
          nullable: true
        assigneeName:
          type: string
          description: Full name of the assigned sales person.
          example: "Priya Shah"
        created_at:
          type: string
          description: Human-readable relative time (e.g., "2d ago", "1h ago").
          example: "2d ago"

    CreateLeadRequest:
      type: object
      required: [name, phone, source_name]
      description: |
        Creates a new lead in the CRM pipeline.
        If the `source_name` doesn't exist yet, it is **automatically created** as a new lead source.
        This allows capturing new acquisition channels on-the-fly from the lead form.
      properties:
        name:
          type: string
          example: "Rahul Mehta"
        phone:
          type: string
          example: "+91-9988776655"
        email:
          type: string
          format: email
          nullable: true
        source_name:
          type: string
          description: Where this lead came from (e.g., Instagram, WhatsApp, Walk-in, Referral). Auto-created if new.
          example: "Instagram"
        course_id:
          type: string
          format: uuid
          nullable: true
          description: The course the lead expressed interest in.
        assigned_sales_id:
          type: string
          format: uuid
          nullable: true
          description: The Employee (SALES role) responsible for following up with this lead.
        owner:
          type: string
          nullable: true
          description: Free-text field to record who "owns" or sourced this lead.
        note:
          type: string
          nullable: true
          description: Any initial observation about the lead (e.g., "Interested in evening batch, budget tight").
        stage:
          type: string
          enum: [NEW, CONTACTED, QUALIFIED, PROPOSAL, CLOSED_WON, CLOSED_LOST]
          default: NEW

    UpdateLeadStageRequest:
      type: object
      required: [stage]
      description: Moves a lead to a new stage in the sales pipeline. Typically called when a sales person completes a follow-up action.
      properties:
        stage:
          type: string
          enum: [NEW, CONTACTED, QUALIFIED, PROPOSAL, CLOSED_WON, CLOSED_LOST]
          example: "CONTACTED"

    # ── Leave ──────────────────────────────────
    LeaveObject:
      type: object
      description: A leave application submitted by a student or employee. Starts in PENDING and moves to APPROVED or REJECTED by an Admin.
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        reason:
          type: string
        leave_type:
          type: string
          enum: [SICK, CASUAL, EARNED, UNPAID]
          description: |
            - SICK: Medical/health-related leave
            - CASUAL: Short-notice personal leave
            - EARNED: Accrued paid leave
            - UNPAID: Leave without pay deduction from salary
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
        created_at:
          type: string
          format: date-time

    CreateLeaveRequest:
      type: object
      required: [start_date, end_date, reason, leave_type]
      description: Submit a leave application. Starts in PENDING status until an Admin approves or rejects it.
      properties:
        start_date:
          type: string
          format: date
          description: First day of the leave period (inclusive).
          example: "2026-08-05"
        end_date:
          type: string
          format: date
          description: Last day of the leave period (inclusive).
          example: "2026-08-07"
        reason:
          type: string
          description: Brief explanation for the leave request.
          example: "Family function"
        leave_type:
          type: string
          enum: [SICK, CASUAL, EARNED, UNPAID]
          example: "CASUAL"

    UpdateLeaveStatusRequest:
      type: object
      required: [status]
      description: Admin decision on a pending leave request. Once set, the attendance record for those days is updated accordingly.
      properties:
        status:
          type: string
          enum: [APPROVED, REJECTED]
          description: APPROVED updates attendance to ON_LEAVE for those days. REJECTED keeps them as ABSENT.
          example: "APPROVED"

    # ── Payroll ────────────────────────────────
    ProcessPayrollRequest:
      type: object
      required: [month, year]
      description: |
        Triggers payroll processing for a given month.
        The system calculates each employee's net salary by:
        1. Starting with their base `salary` from their profile
        2. Deducting for ABSENT or LATE days (based on working_hours in Settings)
        3. Adjusting for approved UNPAID leaves
        4. Applying any manual overrides
      properties:
        month:
          type: integer
          minimum: 1
          maximum: 12
          description: The billing month (1=January, 12=December).
          example: 7
        year:
          type: integer
          example: 2026
        employee_id:
          type: string
          format: uuid
          description: Optional. If provided, processes payroll for only this specific employee instead of all staff.

    # ── Work Report ────────────────────────────
    WorkReportRequest:
      type: object
      required: [description]
      description: A daily work log entry submitted by an employee to document what they accomplished that day.
      properties:
        description:
          type: string
          description: Summary of tasks completed, issues resolved, or progress made during the day.
          example: "Completed integration of fee module, fixed 3 bugs in attendance reports."
        hours_worked:
          type: number
          description: Total productive hours logged for the day.
          example: 8
        date:
          type: string
          format: date
          description: The date this report is for. Defaults to today if not provided.
          example: "2026-07-18"

    # ── Role ───────────────────────────────────
    RoleObject:
      type: object
      description: A named permission set beyond the built-in ADMIN/EMPLOYEE/STUDENT roles. Allows fine-grained access control per feature area.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "Content Manager"
        permissions:
          type: array
          description: List of permission strings (e.g., "blogs:write", "gallery:read") this role grants.
          items:
            type: string
          example: ["blogs:read", "blogs:write", "gallery:read"]
        created_at:
          type: string
          format: date-time

    CreateRoleRequest:
      type: object
      required: [name, permissions]
      description: Define a custom role with a specific set of permissions. Assign this to employees who need access to specific modules without being full Admins.
      properties:
        name:
          type: string
          description: A human-readable name for this role (e.g., "Content Manager", "Accounts Viewer").
          example: "Content Manager"
        permissions:
          type: array
          description: List of permission strings to attach to this role.
          items:
            type: string
          example: ["blogs:read", "blogs:write", "gallery:read"]

    # ── Settings ───────────────────────────────
    SettingsObject:
      type: object
      description: Institute-wide operational settings. These values are used by the attendance, leave, and payroll modules to compute deductions and eligibility.
      properties:
        id:
          type: string
          format: uuid
        company_name:
          type: string
          example: "Novox EdTech LLP"
        max_leave_days:
          type: integer
          description: Maximum paid leave days an employee is entitled to per year.
          example: 12
        working_hours:
          type: number
          description: Standard working hours per day. Used to calculate per-hour salary deductions.
          example: 8
        attendance_grace_minutes:
          type: integer
          description: Number of minutes after shift start before an arrival is marked as LATE.
          example: 15
        updated_at:
          type: string
          format: date-time

    # ── Blog ───────────────────────────────────
    BlogDraftRequest:
      type: object
      required: [topic]
      description: Generates a full blog post draft using AI. The system sends the topic and keywords to the AI model and returns a structured draft ready for review and publishing.
      properties:
        topic:
          type: string
          description: The main subject for the blog post. The more specific, the better the output.
          example: "Top 5 Reasons to Learn Full Stack Development in 2026"
        tone:
          type: string
          enum: [professional, casual, educational, motivational]
          description: Writing style for the blog post.
          default: professional
        keywords:
          type: array
          description: SEO keywords to naturally include in the content.
          items:
            type: string
          example: ["web development", "React", "Node.js"]

    # ── Gallery ────────────────────────────────
    GalleryImageObject:
      type: object
      description: A media asset stored in Cloudinary and tracked in the database. Can be tagged with a category (e.g., Events) and linked to a website for frontend rendering.
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
          example: "https://res.cloudinary.com/novox/image/upload/v1234/photo.jpg"
        title:
          type: string
        category_id:
          type: string
          format: uuid
          nullable: true
        website_id:
          type: string
          format: uuid
          nullable: true
        cloudinary_public_id:
          type: string
          description: Cloudinary's internal identifier. Used for deletion.
        uploaded_at:
          type: string
          format: date-time

  responses:
    Unauthorized:
      description: Missing, expired, or invalid JWT token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            statusCode: 401
            message: "Unauthorized — please log in"
            errors: []
    Forbidden:
      description: Authenticated but the user's role does not have permission for this action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            statusCode: 403
            message: "Forbidden — you do not have permission to access this resource"
            errors: []
    NotFound:
      description: The requested record does not exist in the database.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            statusCode: 404
            message: "Resource not found"
            errors: []
    BadRequest:
      description: Request body failed validation — missing required fields or invalid values.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            statusCode: 400
            message: "Validation failed"
            errors: ["email is required", "password must be at least 6 characters"]

# ─────────────────────────────────────────────
# Global Security
# ─────────────────────────────────────────────
security:
  - BearerAuth: []

# ─────────────────────────────────────────────
# Paths
# ─────────────────────────────────────────────
paths:

  # ════════════════════════════════════════════
  # Health
  # ════════════════════════════════════════════
  /api/health:
    get:
      tags: [Health]
      summary: Server health check
      description: |
        A lightweight endpoint that returns `{ "status": "ok" }` if the server is running.
        **Use case:** Called by the keep-alive cron job every few minutes to prevent the server
        from sleeping on free hosting tiers (e.g., Render free plan). Also used by monitoring tools.
      security: []
      responses:
        '200':
          description: Server is alive and healthy
          content:
            application/json:
              example:
                status: "ok"

  # ════════════════════════════════════════════
  # Auth
  # ════════════════════════════════════════════
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a new student account (public)
      description: |
        **Public endpoint — no authentication required.**

        Allows a prospective student to create their own account. Only the `STUDENT` role
        can be self-registered. Admin and Employee accounts must be provisioned by an Admin
        via `POST /api/v1/users` (and then linked via `POST /api/v1/employees` or the student create endpoint).

        **Use case:** A student fills in the signup form on the institute portal. Their account
        is created immediately and they can log in to view their assigned course and tasks.

        **Note:** This creates the User auth record but does NOT create a student profile.
        The admin should then call `POST /api/v1/students` to create the full profile,
        or the admin can use the all-in-one student creation endpoint which does both.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: "student@example.com"
              password: "Password@123"
              first_name: "Ananya"
              last_name: "Patel"
      responses:
        '201':
          description: Account created. User can now log in with these credentials.
          content:
            application/json:
              example:
                statusCode: 201
                data:
                  id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                  email: "student@example.com"
                  role: "STUDENT"
                message: "User registered successfully"
                success: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Attempted to register with a non-STUDENT role. Only STUDENT accounts allowed via public registration.
          content:
            application/json:
              example:
                success: false
                statusCode: 403
                message: "Public registration is only available for Student accounts"

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login — get access token and refresh token
      description: |
        **Public endpoint — no authentication required.**

        Authenticates a user (Admin, Employee, or Student) and returns:
        - `accessToken` (JWT) in the response body — use this in the `Authorization: Bearer` header for all subsequent requests.
        - `refreshToken` set as an **HttpOnly cookie** — used to silently refresh sessions.

        **Use case:** Called when a user submits the login form. The frontend stores the
        `accessToken` in memory (not localStorage for security) and uses it until it expires.

        All three roles (ADMIN, EMPLOYEE, STUDENT) use this same endpoint. The `role` field in the
        response tells the frontend which dashboard view to show.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: "admin@novox.com"
              password: "SecurePass@123"
      responses:
        '200':
          description: Login successful. Store the `accessToken` for use in all authenticated requests.
          headers:
            Set-Cookie:
              description: HttpOnly refresh token cookie (managed automatically by the browser).
              schema:
                type: string
                example: "refreshToken=eyJhb...; HttpOnly; Path=/"
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  user:
                    id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                    email: "admin@novox.com"
                    role: "ADMIN"
                    status: "ACTIVE"
                  accessToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                message: "Login successful"
                success: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Wrong email or password.
          content:
            application/json:
              example:
                success: false
                statusCode: 401
                message: "Invalid email or password"

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Logout — invalidate session
      description: |
        **Requires authentication.**

        Invalidates the current session by:
        1. Clearing the `refreshToken` from the database (prevents reuse)
        2. Sending a `Set-Cookie` header that clears the `refreshToken` cookie in the browser

        **Use case:** Called when the user clicks the "Logout" button. After this call,
        the stored `accessToken` will still be valid until it expires (short-lived), but
        the `refreshToken` cannot be used to generate a new one, effectively ending the session.
      responses:
        '200':
          description: Logged out. The refreshToken cookie is cleared.
          content:
            application/json:
              example:
                statusCode: 200
                data: {}
                message: "Logout successful"
                success: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Get current logged-in user's identity
      description: |
        **Requires authentication.**

        Returns the auth identity of whoever owns the current JWT token. This includes
        their `id`, `email`, `role`, and `status`.

        **Use case:** Called on app load to verify the session is still valid and to determine
        what role-based UI to render. If this returns 401, the frontend should redirect to login.

        Note: This returns the **User** record (auth identity), not the Employee/Student profile.
        For the full profile with name, phone, etc., use `GET /api/v1/profile/me`.
      responses:
        '200':
          description: The current authenticated user's identity.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                  email: "admin@novox.com"
                  role: "ADMIN"
                  status: "ACTIVE"
                message: "Current user fetched"
                success: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/change-password:
    post:
      tags: [Auth]
      summary: Change the logged-in user's password
      description: |
        **Requires authentication.**

        Allows the currently logged-in user to change their own password. Requires the
        existing password to be provided as proof of identity (prevents unauthorized
        password changes if someone else has access to a valid token).

        **Use case:** Called from the "Change Password" section in the user's account settings.
        Does not log the user out — the current session remains valid after the change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            example:
              oldPassword: "OldPass@123"
              newPassword: "NewPass@456"
      responses:
        '200':
          description: Password changed successfully. No re-login required.
          content:
            application/json:
              example:
                statusCode: 200
                data: {}
                message: "Password changed successfully"
                success: true
        '400':
          description: Old password was incorrect or new password is missing.
          content:
            application/json:
              example:
                success: false
                statusCode: 400
                message: "Old password and new password are required"
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ════════════════════════════════════════════
  # Users  [ADMIN only]
  # ════════════════════════════════════════════
  /api/v1/users:
    get:
      tags: [Users]
      summary: List all system user accounts
      description: |
        **Admin only.**

        Returns all user accounts in the system with their auth-level data (email, role, status, last login).
        This is a management view — it does NOT include profile details like name or phone number.

        **Use case:** Used in the Admin panel to see all registered accounts, identify inactive users,
        audit who has logged in recently, and quickly find a user's ID for further operations.
      responses:
        '200':
          description: List of all user accounts.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  - id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                    email: "admin@novox.com"
                    role: "ADMIN"
                    status: "ACTIVE"
                    last_login: "2026-07-18T10:00:00Z"
                  - id: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
                    email: "hr@novox.com"
                    role: "EMPLOYEE"
                    status: "ACTIVE"
                    last_login: "2026-07-17T09:30:00Z"
                message: "Users fetched successfully"
                success: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Users]
      summary: Create a new system user account
      description: |
        **Admin only.**

        Creates a bare auth-level user account. After creation, a **welcome email with the
        login credentials is automatically sent** to the provided email address.

        **Use case:** When an Admin hires a new employee, they first create a User account here
        (with role=EMPLOYEE), then create the Employee profile via `POST /api/v1/employees` using
        the returned user ID. For students, prefer using `POST /api/v1/students` which does both
        in one step.

        **Important:** The role set here determines all access permissions. Choose carefully:
        - `ADMIN` — full access to everything
        - `EMPLOYEE` — scoped access, requires an Employee profile with a sub-role
        - `STUDENT` — limited to own data only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            example:
              email: "hr@novox.com"
              password: "HrPass@123"
              role: "EMPLOYEE"
              status: "ACTIVE"
      responses:
        '201':
          description: User account created. Welcome email sent to the provided address.
          content:
            application/json:
              example:
                statusCode: 201
                data:
                  id: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
                  email: "hr@novox.com"
                  role: "EMPLOYEE"
                  status: "ACTIVE"
                message: "User created successfully"
                success: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The UUID of the user account.
        example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
    get:
      tags: [Users]
      summary: Get a specific user account by ID
      description: |
        **Admin only.**

        Fetches the auth-level details of a specific user. Useful for verifying a user's
        current status, role, and last login time before performing an action on their account.
      responses:
        '200':
          description: User account found.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                  email: "admin@novox.com"
                  role: "ADMIN"
                  status: "ACTIVE"
                message: "User fetched successfully"
                success: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Users]
      summary: Update a user account
      description: |
        **Admin only.**

        Partially updates a user account. Send only the fields you want to change.

        **Common use cases:**
        - Set `status: INACTIVE` to **suspend** a user who has left the institute without deleting their history
        - Set `status: ACTIVE` to **re-activate** a previously suspended account
        - Change `role` if an employee is promoted to admin
        - Update `email` if a user changed their email address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
            example:
              status: "INACTIVE"
      responses:
        '200':
          description: User account updated.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                  email: "admin@novox.com"
                  status: "INACTIVE"
                message: "User updated successfully"
                success: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Users]
      summary: Permanently delete a user account
      description: |
        **Admin only.**

        Permanently and irreversibly deletes the user record from the system.

        **⚠️ Warning:** This also cascades to delete the associated Student or Employee profile
        and all their historical data. For most cases, prefer setting `status: INACTIVE` instead
        to preserve data while preventing login.

        **Use case:** Removing test accounts or completely purging a user who has requested data deletion.
      responses:
        '200':
          description: User account permanently deleted.
          content:
            application/json:
              example:
                statusCode: 200
                data: {}
                message: "User deleted successfully"
                success: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ════════════════════════════════════════════
  # Students
  # ════════════════════════════════════════════
  /api/v1/students:
    get:
      tags: [Students]
      summary: List all students
      description: |
        **Admin / Employee.**

        Returns the list of all student profiles. Supports filtering to narrow down the list
        for specific use cases like finding all students in a course or searching by name.

        **Use case:** Used in the admin dashboard student list page. Can filter by:
        - `status` — show only currently enrolled (ACTIVE), dropped (INACTIVE), or graduated (COMPLETED) students
        - `course_id` — show all students in a specific course (e.g., for taking batch attendance)
        - `search` — find a student by name or email
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, INACTIVE, COMPLETED]
          description: Filter by student lifecycle status.
        - name: course_id
          in: query
          schema:
            type: string
            format: uuid
          description: Filter to only show students enrolled in this specific course.
        - name: search
          in: query
          schema:
            type: string
          description: Search by first name, last name, or email address.
      responses:
        '200':
          description: Filtered list of student profiles.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  - id: "f9c48f63-7c26-4822-aa54-a9108097e64f"
                    first_name: "Ananya"
                    last_name: "Patel"
                    email: "ananya@example.com"
                    status: "ACTIVE"
                message: "Students fetched successfully"
                success: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Students]
      summary: Enrol a new student (creates account + profile)
      description: |
        **Admin / Employee.**

        Creates both the **User auth account** and the **Student profile** in a single atomic
        operation. This is the recommended way to onboard new students (vs. the self-registration
        flow which only creates the auth account).

        **What happens internally:**
        1. A User record is created with `role: STUDENT`
        2. A Student profile record is created and linked to that User
        3. A welcome email with login credentials is sent to the student's email

        **Use case:** Admin receives a new admission form, fills in the student details, and
        submits. The student immediately gets their login credentials by email and can access
        their dashboard to see their assigned course and tasks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStudentRequest'
            example:
              first_name: "Ananya"
              last_name: "Patel"
              email: "ananya@example.com"
              password: "StudentPass@1"
              phone: "+91-9876543210"
              date_of_birth: "2002-05-15"
              address: "42, MG Road, Pune"
      responses:
        '201':
          description: Student enrolled. Welcome email dispatched.
          content:
            application/json:
              example:
                statusCode: 201
                data:
                  id: "f9c48f63-7c26-4822-aa54-a9108097e64f"
                  first_name: "Ananya"
                  last_name: "Patel"
                  email: "ananya@example.com"
                  status: "ACTIVE"
                message: "Student created successfully"
                success: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/students/reports:
    get:
      tags: [Students]
      summary: Get aggregated student statistics for the dashboard
      description: |
        **Admin / Employee.**

        Returns high-level student statistics used to populate the admin dashboard overview cards.
        Provides counts by status so the institute can quickly assess its current student body.

        **Use case:** Powers the "Student Overview" section on the main dashboard — showing
        total students, how many are actively enrolled, how many have completed, and how many
        are inactive. No parameters needed — always returns counts for all students.
      responses:
        '200':
          description: Aggregated student stats.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  total: 120
                  active: 98
                  completed: 15
                  inactive: 7
                message: "Student reports fetched"
                success: true

  /api/v1/students/{studentId}:
    parameters:
      - name: studentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The UUID of the student profile.
        example: "f9c48f63-7c26-4822-aa54-a9108097e64f"
    get:
      tags: [Students]
      summary: Get a student's full profile
      description: |
        **Admin / Employee / Student (own profile only).**

        Returns the complete profile of a specific student including personal details,
        enrolled courses, and status. Students can only access their own profile — attempting
        to fetch another student's profile will return 403.

        **Use case:**
        - Admin: Opening a student's detail page to review their information
        - Employee: Viewing a student's profile before a mentoring session
        - Student: Viewing their own profile and personal details
      responses:
        '200':
          description: Student profile with full personal details.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  id: "f9c48f63-7c26-4822-aa54-a9108097e64f"
                  first_name: "Ananya"
                  last_name: "Patel"
                  phone: "+91-9876543210"
                  date_of_birth: "2002-05-15"
                  address: "42, MG Road, Pune"
                  status: "ACTIVE"
                message: "Student fetched successfully"
                success: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Students]
      summary: Update a student's profile
      description: |
        **Admin / Employee / Student (own profile only).**

        Partially updates a student's profile. Only send the fields you want to change.

        **Use cases:**
        - Admin: Update a student's status to COMPLETED when they graduate
        - Employee: Correct a student's phone number or address
        - Student: Update their own address or phone number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                phone:
                  type: string
                address:
                  type: string
                status:
                  type: string
                  enum: [ACTIVE, INACTIVE, COMPLETED]
                  description: Admin/Employee only. Students cannot change their own status.
            example:
              phone: "+91-9000000001"
              address: "15, Koregaon Park, Pune"
      responses:
        '200':
          description: Student profile updated.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  id: "f9c48f63-7c26-4822-aa54-a9108097e64f"
                  first_name: "Ananya"
                  phone: "+91-9000000001"
                message: "Student updated successfully"
                success: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Students]
      summary: Permanently delete a student
      description: |
        **Admin only.**

        Permanently removes the student profile, their User account, and all associated records
        (course enrollments, task submissions, fee plans, attendance, documents).

        **⚠️ Warning:** This is irreversible. Consider setting `status: INACTIVE` instead
        to preserve the student's history while preventing access.

        **Use case:** Removing a student who was accidentally entered twice, or purging test data
        from a staging environment.
      responses:
        '200':
          description: Student and all associated data permanently deleted.
          content:
            application/json:
              example:
                statusCode: 200
                data: {}
                message: "Student deleted successfully"
                success: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/students/{studentId}/daily-plan:
    get:
      tags: [Students]
      summary: Get a student's daily study plan
      description: |
        **Admin / Employee / Student.**

        Returns the structured list of tasks and submodules the student is expected to
        work on for a given date (defaults to today). This is the primary view for a
        student's home dashboard — it shows exactly what they need to do today.

        **Use case:** When a student logs in and opens their dashboard, this endpoint
        is called to populate the "Today's Plan" section with pending tasks, their due
        dates, and current submission status.
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: date
          in: query
          schema:
            type: string
            format: date
          description: Target date for the plan. Defaults to today's date if not provided.
          example: "2026-07-18"
      responses:
        '200':
          description: Daily plan with tasks and their statuses.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  date: "2026-07-18"
                  tasks:
                    - id: "task-uuid"
                      title: "Build Todo App"
                      submodule: "Variables & Data Types"
                      due_date: "2026-07-19"
                      status: "PENDING"
                    - id: "task-uuid-2"
                      title: "Write unit tests"
                      due_date: "2026-07-20"
                      status: "SUBMITTED"
                message: "Daily plan fetched"
                success: true

  /api/v1/students/{studentId}/courses:
    post:
      tags: [Students]
      summary: Enrol student in a course
      description: |
        **Admin / Employee.**

        Assigns a published course to a student, beginning their enrollment. Once assigned,
        the system generates the student's task schedule based on the course's modules and
        submodule durations relative to the provided `start_date`.

        **Use case:** After a student's fee plan is set up, an admin assigns them to their
        course. This triggers the full task schedule generation — the student will see their
        day-by-day plan immediately after this call.

        A student can be enrolled in multiple courses simultaneously (e.g., a main course
        and a supplementary short course).
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignCourseRequest'
            example:
              course_id: "6b53bb61-2de7-403d-b7ac-a53ad6143ad6"
              start_date: "2026-08-01"
      responses:
        '201':
          description: Course enrolled. Task schedule generated automatically.
          content:
            application/json:
              example:
                statusCode: 201
                data:
                  student_id: "f9c48f63-7c26-4822-aa54-a9108097e64f"
                  course_id: "6b53bb61-2de7-403d-b7ac-a53ad6143ad6"
                  start_date: "2026-08-01"
                message: "Course assigned successfully"
                success: true

  /api/v1/students/{studentId}/courses/{courseId}:
    parameters:
      - name: studentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: courseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Students]
      summary: Update a student's course enrollment details
      description: |
        **Admin / Employee.**

        Updates enrollment metadata — such as the start date (if it was set wrong), or the
        enrollment status (ACTIVE, COMPLETED, DROPPED).

        **Use cases:**
        - Mark a student's course enrollment as COMPLETED when they finish all modules
        - Change ACTIVE to DROPPED if a student withdraws mid-course
        - Correct the start_date if it was entered incorrectly
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                start_date:
                  type: string
                  format: date
                  description: Correct the course start date if it was entered incorrectly.
                status:
                  type: string
                  enum: [ACTIVE, COMPLETED, DROPPED]
                  description: Update the enrollment state.
            example:
              status: "COMPLETED"
      responses:
        '200':
          description: Enrollment updated.

    delete:
      tags: [Students]
      summary: Remove student from a course enrollment
      description: |
        **Admin / Employee.**

        Removes a student's enrollment from a specific course. This does NOT delete the
        student's task submission history — it just removes the enrollment link.

        **Use case:** A student transferred to a different batch/course and needs to be
        removed from the old one before being enrolled in the new one.
      responses:
        '200':
          description: Student removed from the course. Enrollment history preserved.

  /api/v1/students/{studentId}/progress:
    get:
      tags: [Students]
      summary: Get student's overall course completion progress
      description: |
        **Admin / Employee / Student.**

        Returns a high-level progress summary across all enrolled courses — how many modules
        and submodules have been completed vs. the total, and an overall completion percentage.

        **Use case:** Powers the progress bar widget on the student dashboard and the
        admin's student detail page. Gives a quick "at a glance" view of how far through
        the course the student is.
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Completion statistics across all enrolled courses.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  completedModules: 3
                  totalModules: 8
                  completedSubmodules: 14
                  totalSubmodules: 40
                  completedTasks: 22
                  totalTasks: 60
                  percentage: 35
                message: "Progress fetched"
                success: true

  /api/v1/students/{studentId}/progress/submodules:
    get:
      tags: [Students]
      summary: Get granular submodule-level completion status
      description: |
        **Admin / Employee / Student.**

        Returns the completion status of each individual submodule across all of the student's
        enrolled courses. Useful for rendering a detailed progress checklist or curriculum map.

        **Use case:** Powers the detailed progress view where each submodule shows a
        ✅ (completed) or ⬜ (pending) indicator, letting the student see exactly where they
        are in the curriculum.
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of submodules with their completion status.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  - submodule_id: "sub-uuid-1"
                    title: "Variables & Data Types"
                    completed: true
                    completed_at: "2026-07-10T14:30:00Z"
                  - submodule_id: "sub-uuid-2"
                    title: "Functions & Scope"
                    completed: false
                message: "Submodule progress fetched"
                success: true

  /api/v1/students/{studentId}/progress/submodules/{submoduleId}:
    post:
      tags: [Students]
      summary: Toggle a submodule's completion status
      description: |
        **Admin / Employee / Student.**

        Marks a submodule as complete if it was incomplete, or uncomplete if it was already
        marked done (toggle). This is a deliberate design — students can self-report their
        topic completion on the curriculum checklist.

        **Use case:** A student finishes studying "Async/Await" and clicks the ✅ checkbox
        next to it in their curriculum view. This call marks that submodule complete and
        updates their overall progress percentage.
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: submoduleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Completion toggled. Returns the new state.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  submodule_id: "sub-uuid-1"
                  completed: true
                  completed_at: "2026-07-18T15:30:00Z"
                message: "Submodule progress toggled"
                success: true

  /api/v1/students/{studentId}/tasks:
    get:
      tags: [Students]
      summary: List all tasks assigned to a student
      description: |
        **Admin / Employee / Student.**

        Returns all tasks assigned to the student across their enrolled courses, optionally
        filtered by submission status.

        **Use cases:**
        - Student views their "My Tasks" page to see pending work
        - Admin/Employee views all submitted tasks waiting for review
        - Filter by PENDING to see what tasks are overdue or upcoming
        - Filter by SUBMITTED to see what tasks need grading
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, SUBMITTED, REVIEWED, APPROVED, REJECTED]
          description: Filter tasks by their current review status.
      responses:
        '200':
          description: Tasks list with status and due dates.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  - id: "task-uuid-1"
                    title: "Build a Todo App"
                    status: "PENDING"
                    due_date: "2026-07-20"
                    submodule: "JavaScript Fundamentals"
                  - id: "task-uuid-2"
                    title: "REST API Design"
                    status: "SUBMITTED"
                    due_date: "2026-07-15"
                message: "Tasks fetched"
                success: true

  /api/v1/students/{studentId}/tasks/{taskId}:
    put:
      tags: [Students]
      summary: Update a student task record
      description: |
        **Admin / Employee / Student.**

        General-purpose task update endpoint. Used by admins/employees to add notes,
        or to manually adjust task status in edge cases.

        **Note:** For the standard student submission workflow, use the dedicated
        `POST .../tasks/{taskId}/submit` endpoint instead. For review (approve/reject),
        use `PATCH .../tasks/{taskId}/review`.
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [PENDING, SUBMITTED, REVIEWED, APPROVED, REJECTED]
                  description: Override task status manually.
                notes:
                  type: string
                  description: Internal notes from admin or employee.
            example:
              notes: "Student requested extension — deadline moved by 2 days."
      responses:
        '200':
          description: Task updated.

  /api/v1/students/{studentId}/tasks/{taskId}/submit:
    post:
      tags: [Students]
      summary: Student submits their completed task
      description: |
        **Student only.**

        The primary submission endpoint for students. Called when a student finishes a task
        and wants to submit it for review. They provide a link to their work (GitHub repo,
        deployed URL, Google Doc, etc.) and any notes.

        **What happens after submission:**
        - Task status changes from PENDING to SUBMITTED
        - Admin/Employee can then review it via `PATCH .../tasks/{taskId}/review`

        **Use case:** Student finishes building their "Todo App" project, pushes to GitHub,
        and submits the repo link with a note like "Deployed on Vercel at [url]".
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                submission_url:
                  type: string
                  format: uri
                  description: Link to the student's completed work (GitHub, Vercel, Google Drive, etc.).
                  example: "https://github.com/ananya/todo-app"
                notes:
                  type: string
                  description: Any notes the student wants to add for the reviewer.
                  example: "Deployed on Vercel. Added bonus feature — drag to reorder tasks."
      responses:
        '200':
          description: Task submitted. Now awaiting review from an admin or employee.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  task_id: "task-uuid-1"
                  status: "SUBMITTED"
                  submitted_at: "2026-07-18T16:00:00Z"
                message: "Task submitted successfully"
                success: true

  /api/v1/students/{studentId}/tasks/{taskId}/review:
    patch:
      tags: [Students]
      summary: Instructor reviews and grades a submitted task
      description: |
        **Admin / Employee only.**

        Called by a mentor or admin after evaluating a student's submitted task. Sets the final
        status (APPROVED or REJECTED) and provides written feedback.

        **What happens:**
        - APPROVED: Task is marked as complete; contributes to the student's progress
        - REJECTED: Task is sent back; student can re-submit after fixing issues

        **Use case:** An instructor opens the "Pending Reviews" queue in the admin panel,
        reviews the student's GitHub submission, and either approves it with a compliment
        or rejects it with specific feedback on what needs fixing.
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [APPROVED, REJECTED]
                  description: The reviewer's final decision on this submission.
                  example: "APPROVED"
                feedback:
                  type: string
                  description: Written feedback explaining the decision. Always recommended, especially for REJECTED.
                  example: "Great work! Clean code and excellent UI. Minor: add error handling for empty input."
      responses:
        '200':
          description: Task reviewed. Student will see the updated status and feedback.

  /api/v1/students/{studentId}/academic-journey:
    get:
      tags: [Students]
      summary: Get the student's full academic timeline
      description: |
        **Admin / Employee / Student.**

        Returns a chronological timeline of the student's entire academic history at the
        institute — course enrollments, module completions, task approvals, mentoring sessions,
        attendance milestones, etc.

        **Use case:** Powers the "Academic Journey" or "Timeline" view on a student's profile
        page. Useful for performance reviews, student-parent meetings, or generating progress
        reports. The response data is formatted for visual rendering as a vertical timeline.
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Chronological academic event timeline.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  - date: "2026-08-01"
                    event: "Enrolled in Full Stack Web Development"
                    type: "ENROLLMENT"
                  - date: "2026-08-15"
                    event: "Completed Module 1: JavaScript Fundamentals"
                    type: "MODULE_COMPLETE"
                  - date: "2026-08-20"
                    event: "Task Approved: Build a Todo App"
                    type: "TASK_APPROVED"
                message: "Academic journey fetched"
                success: true

  /api/v1/students/{studentId}/mentoring-sessions:
    get:
      tags: [Students]
      summary: List all mentoring sessions for a student
      description: |
        **Admin / Employee / Student.**

        Returns all scheduled and completed mentoring sessions for this student, including
        the mentor's name, session topic, date, and the student's review/rating (if submitted).

        **Use case:** Used on the student dashboard's "My Sessions" tab and on the mentor's
        schedule view. Helps students see their upcoming 1-on-1 sessions and past session history.
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of mentoring sessions, ordered by date.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  - id: "session-uuid-1"
                    topic: "React Hooks Deep Dive"
                    mentor: "Vikram Singh"
                    session_date: "2026-08-10T10:00:00Z"
                    status: "COMPLETED"
                    student_rating: 5
                message: "Mentoring sessions fetched"
                success: true

  /api/v1/students/{studentId}/mentoring-sessions/{sessionId}/review:
    patch:
      tags: [Students]
      summary: Student submits a rating and feedback for a mentoring session
      description: |
        **Student only.**

        After a mentoring session is marked as COMPLETED, the student can submit a 1-5 star
        rating and written feedback about the session quality. This helps the institute
        track mentor effectiveness and improve the mentoring program.

        **Use case:** After a session concludes, the student receives a prompt: "How was your
        session with Vikram Singh? Leave a rating." They select 5 stars and write "Very helpful,
        explained React context clearly." This call records that feedback.
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                  description: Star rating from 1 (poor) to 5 (excellent).
                  example: 5
                feedback:
                  type: string
                  description: Written feedback about the session.
                  example: "Very helpful session, cleared all my doubts on React hooks."
      responses:
        '200':
          description: Review recorded. Thank you message shown to the student.

  /api/v1/students/{studentId}/documents:
    get:
      tags: [Students]
      summary: List all documents stored for a student
      description: |
        **Admin / Employee / Student.**

        Returns all documents attached to the student's profile — ID proofs, admission letters,
        certificates, etc. Each document has a type label, name, and Cloudinary URL.

        **Use case:** Admin opens a student's profile and needs to verify their Aadhar Card was
        uploaded correctly before admission. Or during certificate issuance, to confirm the
        student's photo ID is on file.
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of student documents with URLs.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  - id: "doc-uuid-1"
                    document_name: "Aadhar Card"
                    document_type: "ID_PROOF"
                    document_url: "https://res.cloudinary.com/novox/raw/upload/v123/id-card.pdf"
                    uploaded_at: "2026-07-01T10:00:00Z"
                message: "Documents fetched"
                success: true

    post:
      tags: [Students]
      summary: Attach a document to a student's profile
      description: |
        **Admin / Employee.**

        Attaches a document (previously uploaded via `POST /api/v1/upload`) to the student's
        profile by storing its Cloudinary URL and metadata.

        **Workflow:**
        1. First, upload the file: `POST /api/v1/upload` → get back `url`
        2. Then, attach it to the student: `POST /api/v1/students/{studentId}/documents`
           with the returned `url`

        **Use case:** Admin uploads a student's scanned admission form PDF and attaches it
        to their profile for future reference.
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document_url, document_type]
              properties:
                document_url:
                  type: string
                  format: uri
                  description: Cloudinary URL returned from the upload endpoint.
                  example: "https://res.cloudinary.com/novox/raw/upload/v123/id-card.pdf"
                document_type:
                  type: string
                  description: Category/type of document (e.g., ID_PROOF, ADMISSION_FORM, CERTIFICATE).
                  example: "ID_PROOF"
                document_name:
                  type: string
                  description: Human-readable label for this document.
                  example: "Aadhar Card"
      responses:
        '201':
          description: Document record created and linked to the student.

  /api/v1/students/{studentId}/documents/{documentId}:
    delete:
      tags: [Students]
      summary: Remove a document from a student's profile
      description: |
        **Admin / Employee.**

        Deletes the document metadata record from the database. Note: This does NOT delete
        the file from Cloudinary — the file itself remains in storage. Only the database
        reference is removed.

        **Use case:** An incorrect or outdated document was uploaded by mistake and needs to
        be removed from the student's profile before uploading the correct version.
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Document record removed from the student's profile.

  # ════════════════════════════════════════════
  # Employees
  # ════════════════════════════════════════════
  /api/v1/employees:
    get:
      tags: [Employees]
      summary: List all employees
      description: |
        **Admin / Employee.**

        Returns all employee profiles with their department role, salary, and status.
        Supports filtering by role to list e.g. only sales staff or only HR.

        **Use case:** HR manager opens the "Staff" page to see all current employees,
        their departments, and who is active. Can filter to `employee_role=SALES` to
        see all sales staff for the performance review.
      parameters:
        - name: employee_role
          in: query
          schema:
            type: string
            enum: [SALES, MARKETING, HR, DEVELOPMENT, DESIGN, ACCOUNTS]
          description: Filter to show only employees in a specific functional department.
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, INACTIVE]
          description: Filter by employment status.
      responses:
        '200':
          description: List of employee profiles.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  - id: "emp-uuid-1"
                    first_name: "Vikram"
                    last_name: "Singh"
                    employee_role: "HR"
                    salary: 45000
                    status: "ACTIVE"
                message: "Employees fetched successfully"
                success: true

    post:
      tags: [Employees]
      summary: Onboard a new employee
      description: |
        **Admin / HR Employee.**

        Creates both the **User auth account** (with role=EMPLOYEE) and the **Employee HR profile**
        in a single operation. A welcome email with login credentials is automatically sent.

        **Use case:** HR manager onboards a new hire. They fill in the employee's details,
        select their department role (e.g., DEVELOPMENT), set their salary, and submit.
        The new employee immediately receives their login credentials by email.

        **Employee sub-roles and what they unlock:**
        - `HR` — Can create/manage other employees
        - `SALES` — Appears in the leads assignee list for the CRM
        - `DEVELOPMENT/DESIGN` — Can be assigned as course instructors
        - `ACCOUNTS` — Access to financial data (fees, payroll)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmployeeRequest'
            example:
              first_name: "Vikram"
              last_name: "Singh"
              email: "vikram@novox.com"
              password: "EmpPass@123"
              employee_role: "HR"
              phone: "+91-9123456789"
              salary: 45000
              join_date: "2026-08-01"
              department: "Human Resources"
      responses:
        '201':
          description: Employee onboarded. Welcome email sent.

  /api/v1/employees/reports:
    get:
      tags: [Employees]
      summary: Get aggregated employee performance report
      description: |
        **Admin / HR Employee.**

        Returns high-level statistics about the workforce — total employees, breakdown by
        department role, attendance summary, and performance metrics.

        **Use case:** HR opens the "Employee Reports" page for the monthly HR review meeting.
        The report shows department headcounts, average attendance rates, and flags employees
        with consistently low attendance.
      responses:
        '200':
          description: Aggregated HR statistics and performance data.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  total: 18
                  by_role:
                    SALES: 4
                    HR: 2
                    DEVELOPMENT: 6
                    DESIGN: 3
                    MARKETING: 2
                    ACCOUNTS: 1
                  avg_attendance_percentage: 91.5
                message: "Employee report fetched"
                success: true

  /api/v1/employees/{employeeId}:
    parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The UUID of the employee profile.
    get:
      tags: [Employees]
      summary: Get an employee's full profile
      description: |
        **Admin / Employee.**

        Returns the complete HR profile of a specific employee, including their personal
        details, role, salary, joined date, and assigned courses.

        **Use case:** HR opens an employee's profile before their performance review.
        Or an employee opens a colleague's profile to find their phone number for coordination.
      responses:
        '200':
          description: Full employee profile with HR details.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  id: "emp-uuid-1"
                  first_name: "Vikram"
                  last_name: "Singh"
                  employee_role: "HR"
                  phone: "+91-9123456789"
                  salary: 45000
                  join_date: "2026-01-15"
                  status: "ACTIVE"
                message: "Employee fetched"
                success: true

    put:
      tags: [Employees]
      summary: Update an employee's profile
      description: |
        **Admin / HR Employee.**

        Partially updates an employee's HR profile. Common updates include salary revisions
        (annual appraisal), role changes (transfers between departments), or marking an
        employee as INACTIVE when they resign.

        **Use cases:**
        - Annual appraisal: Update `salary` to the revised amount
        - Department transfer: Change `employee_role` to new department
        - Resignation: Set `status: INACTIVE` to suspend access while preserving records
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                phone:
                  type: string
                salary:
                  type: number
                  description: New monthly gross salary after revision.
                employee_role:
                  type: string
                  enum: [SALES, MARKETING, HR, DEVELOPMENT, DESIGN, ACCOUNTS]
                status:
                  type: string
                  enum: [ACTIVE, INACTIVE]
            example:
              salary: 52000
              employee_role: "DEVELOPMENT"
      responses:
        '200':
          description: Employee profile updated.

    delete:
      tags: [Employees]
      summary: Permanently delete an employee record
      description: |
        **Admin / HR Employee.**

        Permanently removes the employee profile and linked User account from the system.

        **⚠️ Warning:** All historical data (attendance, payroll, work reports, mentoring
        sessions) will also be deleted. Prefer setting `status: INACTIVE` to preserve history.

        **Use case:** Removing test/dummy employee accounts from staging.
      responses:
        '200':
          description: Employee and all associated records deleted.

  /api/v1/employees/{employeeId}/daily-plan:
    get:
      tags: [Employees]
      summary: Get an employee's daily teaching schedule
      description: |
        **Admin / Employee.**

        Returns the list of submodules this employee is scheduled to teach on a given date
        (defaults to today), along with the students in each session.

        **Use case:** An instructor (DEVELOPMENT employee) opens their dashboard and sees
        what topics they are scheduled to teach today, which students are in each session,
        and what time the sessions start.
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: date
          in: query
          schema:
            type: string
            format: date
          description: Target date. Defaults to today.
          example: "2026-07-18"
      responses:
        '200':
          description: Scheduled teaching sessions for the day.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  date: "2026-07-18"
                  sessions:
                    - submodule: "Async/Await & Promises"
                      course: "Full Stack Web Development"
                      scheduled_time: "2026-07-18T10:00:00Z"
                      student_count: 8
                message: "Daily plan fetched"
                success: true

  /api/v1/employees/{employeeId}/available-topics:
    get:
      tags: [Employees]
      summary: Get submodules available for this employee to teach
      description: |
        **Admin / Employee.**

        Returns a list of course submodules that this employee is qualified/assigned to teach
        and which haven't yet been scheduled for them. Used when building their teaching schedule.

        **Use case:** Admin opens the schedule builder for an instructor. This endpoint
        returns all unscheduled submodules from the courses this instructor is assigned to,
        so the admin can drag-and-drop them onto the calendar.
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of available (unscheduled) submodules for teaching.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  - submodule_id: "sub-uuid-3"
                    title: "Async/Await & Promises"
                    module: "JavaScript Fundamentals"
                    course: "Full Stack Web Development"
                    duration_hours: 3
                message: "Available topics fetched"
                success: true

  /api/v1/employees/{employeeId}/topics/{submoduleId}/schedule:
    patch:
      tags: [Employees]
      summary: Schedule a specific teaching topic for an employee
      description: |
        **Admin / Employee.**

        Assigns a specific date and time for an employee to teach a particular submodule.
        Creates a scheduled session visible on the employee's daily plan and the admin's
        consolidated schedule view.

        **Use case:** Admin schedules Vikram Singh to teach "Async/Await & Promises" to
        the Full Stack batch on August 12th at 10 AM. After this call, it appears on
        Vikram's daily plan for that date and in the admin's overview.
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: submoduleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The submodule to schedule this employee to teach.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scheduled_date:
                  type: string
                  format: date-time
                  description: Date and time for the teaching session.
                  example: "2026-08-12T10:00:00Z"
      responses:
        '200':
          description: Teaching session scheduled. Now visible on the employee's daily plan.

  /api/v1/employees/{employeeId}/mentoring-sessions:
    get:
      tags: [Employees]
      summary: List all mentoring sessions conducted by this employee
      description: |
        **Admin / Employee.**

        Returns all past and upcoming mentoring sessions where this employee is the mentor.
        Includes student names, topics, dates, and student ratings.

        **Use case:** An employee opens their "My Mentoring Sessions" view to see their
        upcoming 1-on-1s and review feedback from past sessions. HR uses this to assess
        the quality of mentoring being provided.
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: All mentoring sessions for this employee.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  - id: "session-uuid-1"
                    student_name: "Ananya Patel"
                    topic: "React Hooks Deep Dive"
                    session_date: "2026-08-10T10:00:00Z"
                    status: "UPCOMING"
                    student_rating: null
                message: "Mentoring sessions fetched"
                success: true

    post:
      tags: [Employees]
      summary: Schedule a new mentoring session
      description: |
        **Admin / Employee.**

        Schedules a new one-on-one mentoring session between this employee (as mentor)
        and a specific student. The session appears on both the mentor's daily plan and
        the student's mentoring sessions list.

        **Use case:** An instructor notices a student struggling with React state management.
        They schedule a 1-hour session to address it. Both the instructor and student
        will see the session in their respective views.
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMentoringSessionRequest'
            example:
              student_id: "f9c48f63-7c26-4822-aa54-a9108097e64f"
              session_date: "2026-08-10T10:00:00Z"
              topic: "React Hooks Deep Dive"
              notes: "Focus on useEffect dependencies and the cleanup function."
      responses:
        '201':
          description: Mentoring session scheduled. Visible to both mentor and student.

  /api/v1/employees/{employeeId}/documents:
    post:
      tags: [Employees]
      summary: Attach an HR document to an employee's record
      description: |
        **Admin / HR Employee.**

        Attaches a document (previously uploaded via `POST /api/v1/upload`) to the employee's
        HR profile.

        **Common document types:**
        - `OFFER_LETTER` — Signed employment offer
        - `ID_PROOF` — Aadhar Card, Passport, etc.
        - `NDA` — Non-disclosure agreement
        - `APPRAISAL` — Annual performance review document
        - `EXPERIENCE_LETTER` — Issued when employee leaves

        **Workflow:** Upload the file first via `POST /api/v1/upload`, then attach the
        returned URL here.
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                document_url:
                  type: string
                  format: uri
                  description: Cloudinary URL from the upload endpoint.
                  example: "https://res.cloudinary.com/novox/raw/upload/v123/offer-letter.pdf"
                document_type:
                  type: string
                  example: "OFFER_LETTER"
                document_name:
                  type: string
                  description: Human-readable label.
                  example: "Signed Offer Letter - August 2026"
      responses:
        '201':
          description: Document attached to the employee's HR record.

  /api/v1/employees/{employeeId}/documents/{docId}:
    delete:
      tags: [Employees]
      summary: Remove an HR document from an employee's record
      description: |
        **Admin / HR Employee.**

        Removes the document metadata link from the employee's profile. The Cloudinary file
        itself is NOT deleted from storage.

        **Use case:** An outdated version of an appraisal document was uploaded. HR deletes
        the old record and re-uploads the correct version.
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: docId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Document record removed from the employee's profile.

  /api/v1/employees/{employeeId}/courses:
    post:
      tags: [Employees]
      summary: Assign employee as an instructor to a course
      description: |
        **Admin / HR Employee.**

        Links an employee to a course as one of its instructors. After this, the employee
        will appear in the course's instructor list and can be assigned specific submodules
        to teach via the scheduling endpoints.

        **Use case:** A new course (UI/UX Design) is created. Admin assigns two DESIGN
        department employees as instructors. They can now be given specific submodules
        to teach within that course.
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [course_id]
              properties:
                course_id:
                  type: string
                  format: uuid
                  description: The course to assign this employee as an instructor for.
      responses:
        '201':
          description: Employee assigned as instructor. They can now be scheduled to teach submodules in this course.

  /api/v1/employees/{employeeId}/courses/{courseId}:
    delete:
      tags: [Employees]
      summary: Remove employee as instructor from a course
      description: |
        **Admin / HR Employee.**

        Removes the instructor link between an employee and a course. They will no longer
        appear in the course's instructor list or receive scheduling assignments for it.

        **Use case:** An employee transfers departments and is no longer responsible for
        teaching a specific course. Their past teaching history is preserved; only the
        active instructor link is removed.
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Instructor link removed. Past session history preserved.

  # ════════════════════════════════════════════
  # Courses
  # ════════════════════════════════════════════
  /api/v1/courses:
    get:
      tags: [Courses]
      summary: List all courses
      description: |
        **Admin / Employee / Student.**

        Returns all courses in the system. Role-based filtering is applied internally:
        - Admin/Employee: See DRAFT, PUBLISHED, and ARCHIVED courses
        - Student: Only see PUBLISHED courses

        Optional `status` query param allows Admins to filter by state.

        **Use case:**
        - Admin: Overview of all courses, their states, and fees in the Course Management panel
        - Employee: Pick a course when scheduling a mentoring session topic
        - Student: Browse available courses to express interest
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, PUBLISHED, ARCHIVED]
          description: Filter by course lifecycle status (Admin/Employee only).
      responses:
        '200':
          description: List of courses. Students only see PUBLISHED ones.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  - id: "6b53bb61-2de7-403d-b7ac-a53ad6143ad6"
                    name: "Full Stack Web Development"
                    status: "PUBLISHED"
                    duration_months: 6
                    fee: 125000
                message: "Courses fetched"
                success: true

    post:
      tags: [Courses]
      summary: Create a new course (starts as DRAFT)
      description: |
        **Admin / Senior Employees (HR, DEVELOPMENT, DESIGN, SALES, MARKETING).**

        Creates a new course in `DRAFT` status. While in DRAFT, it is invisible to students.
        The typical workflow after creation:
        1. Add modules → submodules → tasks (build the curriculum)
        2. Assign instructors
        3. Call `PATCH /{courseId}/publish` to make it live

        **Use case:** The curriculum team designs a new "UI/UX Design Fundamentals" course.
        They create it here, build out the module structure over a few days, then publish it
        when ready for enrollment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCourseRequest'
            example:
              name: "Full Stack Web Development"
              description: "A comprehensive 6-month program covering React, Node.js, and PostgreSQL."
              duration_months: 6
              fee: 125000
      responses:
        '201':
          description: Course created in DRAFT status. Build the curriculum, then publish.

  /api/v1/courses/daily-plan:
    get:
      tags: [Courses]
      summary: Admin's consolidated teaching schedule for today
      description: |
        **Admin only.**

        Returns a unified view of every scheduled teaching session happening today across
        all courses and all instructors. Includes submodule name, instructor, course,
        time, and enrolled students.

        **Use case:** An admin opens the "Today's Schedule" overview to see the institute's
        complete academic activity for the day — what's being taught, by whom, to which
        batch, and when. Used to spot scheduling conflicts or gaps.
      responses:
        '200':
          description: Today's complete teaching schedule across all courses.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  date: "2026-07-18"
                  sessions:
                    - course: "Full Stack Web Development"
                      submodule: "Async/Await & Promises"
                      instructor: "Vikram Singh"
                      time: "2026-07-18T10:00:00Z"
                      students: 8
                    - course: "UI/UX Design Fundamentals"
                      submodule: "Color Theory Basics"
                      instructor: "Priya Shah"
                      time: "2026-07-18T14:00:00Z"
                      students: 5
                message: "Admin daily plan fetched"
                success: true

  /api/v1/courses/daily-plan/reviews:
    get:
      tags: [Courses]
      summary: Get all student submodule reviews
      description: |
        **Admin / Employee.**

        Returns all ratings and feedback submitted by students for completed submodules.
        Ordered by recency so the latest reviews appear first.

        **Use case:** Admin monitors course quality by reading student feedback after each
        submodule. A consistently low rating on a specific submodule might indicate that
        the teaching material or delivery needs improvement.
      responses:
        '200':
          description: All submodule reviews with ratings and feedback.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  - submodule: "Async/Await & Promises"
                    course: "Full Stack Web Development"
                    student: "Ananya Patel"
                    rating: 4
                    comment: "Excellent explanation, very clear examples."
                    submitted_at: "2026-07-16T18:00:00Z"
                message: "Submodule reviews fetched"
                success: true

  /api/v1/courses/{courseId}:
    parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The UUID of the course.
    get:
      tags: [Courses]
      summary: Get course with full curriculum tree
      description: |
        **Admin / Employee / Student.**

        Returns complete course details including the nested curriculum structure:
        Course → Modules → Submodules (with tasks).

        **Use case:**
        - Admin/Employee: View and manage the full curriculum structure in the course builder
        - Student: Load the course syllabus/curriculum page to see all topics they will cover
        - The entire nested structure (modules, submodules) is returned in a single call for efficiency
      responses:
        '200':
          description: Full course with nested curriculum tree.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  id: "6b53bb61-2de7-403d-b7ac-a53ad6143ad6"
                  name: "Full Stack Web Development"
                  status: "PUBLISHED"
                  duration_months: 6
                  fee: 125000
                  modules:
                    - id: "mod-uuid"
                      title: "Module 1: JavaScript Fundamentals"
                      order: 1
                      submodules:
                        - id: "sub-uuid"
                          title: "Variables & Data Types"
                          duration_hours: 2.5
                          order: 1
                message: "Course fetched"
                success: true

    put:
      tags: [Courses]
      summary: Update course name, description, fee, or duration
      description: |
        **Admin / Senior Employees.**

        Updates the top-level metadata of a course. Only affects the course header —
        not the curriculum (modules, submodules, tasks). Partial updates are supported.

        **Use case:** The course fee is revised for the new academic year, or the course
        description is rewritten for the marketing page.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCourseRequest'
            example:
              fee: 135000
              description: "Updated for the 2026-27 batch. Now includes GraphQL module."
      responses:
        '200':
          description: Course metadata updated.

    delete:
      tags: [Courses]
      summary: Delete a course permanently
      description: |
        **Admin / Senior Employees.**

        Permanently deletes the course and all its associated curriculum (modules,
        submodules, tasks). Student enrollment records are affected.

        **⚠️ Warning:** Only delete DRAFT or ARCHIVED courses. Deleting a PUBLISHED course
        with active student enrollments will cause data consistency issues. Archive first,
        then delete if needed.

        **Use case:** A course was created as a test or the curriculum is being completely
        replaced with a new version.
      responses:
        '200':
          description: Course and full curriculum deleted.

  /api/v1/courses/{courseId}/publish:
    patch:
      tags: [Courses]
      summary: Publish a course (DRAFT → PUBLISHED)
      description: |
        **Admin / Senior Employees.**

        Transitions a course from `DRAFT` to `PUBLISHED` status. Published courses are visible
        to students and can be assigned via enrollment. This is a one-way toggle — to revert,
        use the archive endpoint.

        **Use case:** The curriculum team has finished building the "UI/UX Design" course —
        all modules, submodules, and tasks are complete and reviewed. Admin publishes it so
        the admissions team can start enrolling students.

        **Prerequisite:** The course should have at least one module and submodule before publishing.
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Course is now PUBLISHED and visible to students.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  id: "6b53bb61-2de7-403d-b7ac-a53ad6143ad6"
                  status: "PUBLISHED"
                message: "Course published successfully"
                success: true

  /api/v1/courses/{courseId}/archive:
    patch:
      tags: [Courses]
      summary: Archive a course (PUBLISHED → ARCHIVED)
      description: |
        **Admin / Senior Employees.**

        Transitions a course from `PUBLISHED` to `ARCHIVED` status. Archived courses are
        hidden from students but all data is preserved. Existing student enrollments remain
        intact for historical purposes.

        **Use case:** A course's curriculum is outdated and a new version is being created.
        Archive the old version to hide it from new enrollments, while keeping existing
        students' progress records intact. The new version will be a separate course.
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Course is now ARCHIVED. Hidden from students. Data preserved.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  id: "6b53bb61-2de7-403d-b7ac-a53ad6143ad6"
                  status: "ARCHIVED"
                message: "Course archived successfully"
                success: true

  /api/v1/courses/{courseId}/students:
    get:
      tags: [Courses]
      summary: List students enrolled in this course
      description: |
        **Admin / Employee.**

        Returns all students currently enrolled in a specific course with their
        enrollment status and progress percentage.

        **Use case:** Admin opens a course's detail page to see the batch — who is enrolled,
        which students are active vs. completed, and their progress. Used before taking
        bulk attendance for the batch.
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of enrolled students with progress data.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  - student_id: "f9c48f63-7c26-4822-aa54-a9108097e64f"
                    name: "Ananya Patel"
                    email: "ananya@example.com"
                    enrollment_status: "ACTIVE"
                    progress_percentage: 35
                message: "Course students fetched"
                success: true

  /api/v1/courses/{courseId}/students/batch-assign:
    post:
      tags: [Courses]
      summary: Enrol multiple students into a course at once
      description: |
        **Admin / Senior Employees.**

        Enrols multiple students into a course in a single API call. Much more efficient
        than calling the individual enrolment endpoint for each student.

        **Use case:** A new batch of 15 students has been admitted for the Full Stack
        Web Development course starting August 1st. Admin selects all 15 students from
        the student list and batch-assigns them all with a single start date.
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [student_ids]
              properties:
                student_ids:
                  type: array
                  description: Array of student UUIDs to enrol in this course.
                  items:
                    type: string
                    format: uuid
                  example: ["student-uuid-1", "student-uuid-2", "student-uuid-3"]
                start_date:
                  type: string
                  format: date
                  description: Course start date for all students in this batch.
                  example: "2026-08-01"
      responses:
        '200':
          description: All students enrolled. Task schedules generated for each.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  enrolled: 15
                  start_date: "2026-08-01"
                message: "Students batch assigned successfully"
                success: true

  /api/v1/courses/{courseId}/employees:
    get:
      tags: [Courses]
      summary: List instructors assigned to this course
      description: |
        **Admin / Employee.**

        Returns all employees who are assigned as instructors for this course, along with
        the submodules they are responsible for teaching.

        **Use case:** Admin opens the course management page and sees the "Instructors" tab
        showing all assigned teachers, their departments, and how many submodules they own.
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of instructors assigned to this course.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  - employee_id: "emp-uuid-1"
                    name: "Vikram Singh"
                    employee_role: "DEVELOPMENT"
                    assigned_submodules: 5
                message: "Course instructors fetched"
                success: true

  /api/v1/courses/{courseId}/instructors:
    post:
      tags: [Courses]
      summary: Assign an instructor to this course
      description: |
        **Admin / Senior Employees.**

        Links a DEVELOPMENT, DESIGN, or other relevant employee to a course as an instructor.
        After assignment, the employee appears in the "Available Instructors" list when
        scheduling teaching sessions for this course.

        **Use case:** A new UI/UX module is added to the Full Stack course. Admin assigns
        a DESIGN employee as instructor for the new module's submodules.
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employee_id]
              properties:
                employee_id:
                  type: string
                  format: uuid
                  description: The employee to assign as instructor.
      responses:
        '201':
          description: Instructor assigned to the course.

  /api/v1/courses/{courseId}/instructors/{instructorId}:
    delete:
      tags: [Courses]
      summary: Remove an instructor from this course
      description: |
        **Admin / Senior Employees.**

        Removes the instructor assignment. The employee will no longer appear in the course's
        instructor list and cannot be scheduled for new teaching sessions in this course.
        Past sessions they taught are preserved.

        **Use case:** An employee moves to a different department and is no longer responsible
        for teaching in a specific course.
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: instructorId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The employee UUID of the instructor to remove.
      responses:
        '200':
          description: Instructor removed from course. Past sessions preserved.

  /api/v1/courses/{courseId}/modules:
    post:
      tags: [Courses]
      summary: Add a module (chapter) to a course
      description: |
        **Admin / Senior Employees.**

        Adds a new top-level chapter/module to the course curriculum. Modules are the
        major sections of a course (e.g., "Module 1: JavaScript Fundamentals",
        "Module 2: React Framework").

        **Use case:** While building the Full Stack course curriculum, the curriculum team
        adds each major topic as a module. Then submodules (specific topics) and tasks
        (assignments) are added within each module.

        The `order` field determines the module's position in the course sequence.
        Use the reorder endpoint if you need to change positions later.
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateModuleRequest'
            example:
              title: "Module 1: JavaScript Fundamentals"
              description: "Core JavaScript concepts that form the foundation of web development."
              order: 1
      responses:
        '201':
          description: Module added to the course curriculum.

  /api/v1/courses/{courseId}/modules/reorder:
    patch:
      tags: [Courses]
      summary: Reorder modules within a course
      description: |
        **Admin / Senior Employees.**

        Changes the display order of modules within a course by providing the desired
        sequence of module UUIDs. The system updates all order values in one operation.

        **Use case:** After building the curriculum, the team realises "Module 3: Node.js"
        should come before "Module 2: React" pedagogically. They drag-and-drop in the
        curriculum builder, which calls this endpoint with the new sequence.
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order]
              properties:
                order:
                  type: array
                  description: Array of module UUIDs in the desired display order (first = position 1).
                  items:
                    type: string
                    format: uuid
                  example: ["mod-uuid-2", "mod-uuid-3", "mod-uuid-1"]
      responses:
        '200':
          description: Module order updated. All modules now have new sequential positions.

  /api/v1/courses/{courseId}/modules/{moduleId}:
    parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: moduleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Courses]
      summary: Update a module's title or description
      description: |
        **Admin / Senior Employees.**

        Updates the title, description, or order of an existing module. Use this to
        correct typos, improve the module description, or manually set the order value.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateModuleRequest'
            example:
              title: "Module 1: JavaScript & TypeScript Fundamentals"
              description: "Updated to include TypeScript basics."
      responses:
        '200':
          description: Module updated.

    delete:
      tags: [Courses]
      summary: Delete a module and all its submodules/tasks
      description: |
        **Admin / Senior Employees.**

        Permanently deletes this module and all its child submodules and tasks. Student
        progress records for those submodules will also be affected.

        **⚠️ Warning:** This cascades. Deleting a module removes all submodules and tasks
        nested inside it. Only do this for DRAFT courses or courses with no active enrollments.
      responses:
        '200':
          description: Module and all child content deleted.

  /api/v1/courses/{courseId}/modules/{moduleId}/status:
    patch:
      tags: [Courses]
      summary: Update a module's teaching status
      description: |
        **Admin / Senior Employees.**

        Updates the operational status of a module to track curriculum delivery progress.

        **Status meanings:**
        - `DRAFT` — Module content is being built, not yet ready to teach
        - `ACTIVE` — Module is currently being taught to students
        - `COMPLETED` — All submodules in this module have been taught

        **Use case:** After all submodules of "Module 1: JavaScript Fundamentals" have been
        taught, the admin marks it COMPLETED so it's clear in the schedule overview which
        modules are done and which are still in progress.
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: moduleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [DRAFT, ACTIVE, COMPLETED]
                  example: "ACTIVE"
      responses:
        '200':
          description: Module status updated.

  /api/v1/courses/{courseId}/modules/{moduleId}/submodules:
    post:
      tags: [Courses]
      summary: Add a submodule (topic) to a module
      description: |
        **Admin / Senior Employees.**

        Adds a specific topic as a submodule within a module. Submodules are the atomic
        teaching units — each submodule represents one distinct topic to be taught in a session.

        The `duration_hours` field is critical — it's used by the **auto-scheduler** to
        calculate how much calendar time to allocate to this topic when generating the teaching plan.

        **Use case:** Within "Module 1: JavaScript", the team adds individual submodules:
        "Variables & Data Types" (2h), "Functions & Scope" (3h), "Arrays & Objects" (2.5h).
        Each will become a separate teaching session in the schedule.
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: moduleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubmoduleRequest'
            example:
              title: "Variables & Data Types"
              description: "Understanding var, let, const and JavaScript's type system."
              order: 1
              duration_hours: 2.5
      responses:
        '201':
          description: Submodule added. Will appear in the course curriculum and auto-scheduler.

  /api/v1/courses/{courseId}/modules/{moduleId}/submodules/reorder:
    patch:
      tags: [Courses]
      summary: Reorder submodules within a module
      description: |
        **Admin / Senior Employees.**

        Changes the order in which submodules appear within a module. Provide the desired
        sequence as an array of submodule UUIDs.

        **Use case:** After discussion, the team decides "Async/Await" should be taught
        before "Promises" (reversed order). They drag them in the UI and this endpoint
        persists the new order.
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: moduleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order]
              properties:
                order:
                  type: array
                  description: Submodule UUIDs in the desired teaching order.
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Submodule order updated.

  /api/v1/courses/{courseId}/modules/{moduleId}/submodules/{submoduleId}:
    parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: moduleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: submoduleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Courses]
      summary: Update a submodule's details
      description: |
        **Admin / Senior Employees.**

        Updates the title, description, order, or `duration_hours` of an existing submodule.
        Changing `duration_hours` will affect future schedule auto-generation for this topic.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubmoduleRequest'
            example:
              title: "Variables, Data Types & Type Coercion"
              duration_hours: 3
      responses:
        '200':
          description: Submodule updated.

    delete:
      tags: [Courses]
      summary: Delete a submodule and all its tasks
      description: |
        **Admin / Senior Employees.**

        Permanently deletes the submodule and all its child tasks. Student completion
        records for this submodule will also be deleted.

        **⚠️ Warning:** Cascades to tasks nested inside. Only safe to do on DRAFT courses
        or courses with no active student enrollments.
      responses:
        '200':
          description: Submodule and all nested tasks deleted.

  /api/v1/courses/{courseId}/modules/{moduleId}/submodules/{submoduleId}/reviews:
    post:
      tags: [Courses]
      summary: Student submits a rating for a completed submodule
      description: |
        **Student only.**

        After a student marks a submodule as completed, they can submit a 1-5 star rating
        and a written comment about the quality of that topic's teaching/material.

        This feedback is aggregated and visible to Admins/Employees via
        `GET /api/v1/courses/daily-plan/reviews` to monitor course quality.

        **Use case:** After completing "Async/Await & Promises", a student is prompted:
        "How was this topic?" They rate it 4 stars and write "Great examples, but could
        use more exercises."
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: moduleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: submoduleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                  description: Quality rating from 1 (poor) to 5 (excellent).
                  example: 4
                comment:
                  type: string
                  description: Optional written feedback about this topic's teaching quality.
                  example: "Excellent explanation, very clear examples. Could use a few more practice exercises."
      responses:
        '201':
          description: Review submitted. Will appear in the admin's reviews dashboard.

  /api/v1/courses/{courseId}/modules/{moduleId}/submodules/{submoduleId}/tasks:
    post:
      tags: [Courses]
      summary: Add a practical task/assignment to a submodule
      description: |
        **Admin / Senior Employees.**

        Adds a hands-on task/assignment to a submodule. When a student's course schedule
        reaches this submodule, this task will automatically appear in their task list
        with a computed due date based on `due_days`.

        **Use case:** After adding the "Async/Await" submodule, the curriculum team adds a
        task: "Build an async weather app" with a 3-day deadline and detailed instructions.
        Every student assigned to this course will get this task added to their queue
        when they reach this submodule.
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: moduleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: submoduleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
            example:
              title: "Build an Async Weather App"
              description: "Create a weather dashboard that fetches data from the OpenWeather API using async/await. Must include: city search, 5-day forecast, error handling."
              due_days: 3
              order: 1
      responses:
        '201':
          description: Task added to the submodule. Will auto-appear in student task lists when they reach this submodule.

  /api/v1/courses/{courseId}/modules/{moduleId}/submodules/{submoduleId}/tasks/reorder:
    patch:
      tags: [Courses]
      summary: Reorder tasks within a submodule
      description: |
        **Admin / Senior Employees.**

        Changes the order in which tasks appear within a submodule. Useful when a task
        that was added later should be shown before an existing one.
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: moduleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: submoduleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order]
              properties:
                order:
                  type: array
                  description: Task UUIDs in the desired display/assignment order.
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Task order updated.

  /api/v1/courses/{courseId}/modules/{moduleId}/submodules/{submoduleId}/tasks/{taskId}:
    parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: moduleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: submoduleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Courses]
      summary: Update a task's details
      description: |
        **Admin / Senior Employees.**

        Updates the title, instructions, due days, or order of an existing task.
        Changing `due_days` affects future student task deadlines but does not retroactively
        change deadlines already generated for enrolled students.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
            example:
              title: "Build an Async Weather App (with TypeScript)"
              description: "Updated: Now requires TypeScript strict mode."
              due_days: 4
      responses:
        '200':
          description: Task updated.

    delete:
      tags: [Courses]
      summary: Delete a task from the curriculum
      description: |
        **Admin / Senior Employees.**

        Permanently removes the task from the submodule curriculum and all student task
        assignment records. Use carefully on live courses with active student enrollments.
      responses:
        '200':
          description: Task deleted from curriculum and student records.

  /api/v1/courses/{courseId}/modules/{moduleId}/submodules/{submoduleId}/tasks/{taskId}/subtasks:
    post:
      tags: [Courses]
      summary: Add a subtask (checklist item) to a task
      description: |
        **Admin / Senior Employees.**

        Adds a granular subtask/checklist item to an existing task. Subtasks help break down
        complex tasks into smaller, trackable steps.

        **Use case:** The "Build a Weather App" task is broken into subtasks:
        1. "Set up API key and test fetch call"
        2. "Build the search bar UI"
        3. "Display current weather data"
        4. "Add the 5-day forecast section"
        5. "Add error handling for invalid city names"

        Students check off each subtask as they complete it, giving a clearer sense of progress.
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: moduleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: submoduleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  description: The checklist item text.
                  example: "Set up API key and test the OpenWeather fetch call"
                order:
                  type: integer
                  description: Display position within the task's subtask list.
      responses:
        '201':
          description: Subtask added to the task checklist.

  /api/v1/courses/{courseId}/modules/{moduleId}/submodules/{submoduleId}/tasks/{taskId}/subtasks/reorder:
    patch:
      tags: [Courses]
      summary: Reorder subtasks within a task
      description: |
        **Admin / Senior Employees.**

        Changes the order of subtasks (checklist steps) within a task. Useful when the
        logical step sequence needs to be adjusted.
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: moduleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: submoduleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order]
              properties:
                order:
                  type: array
                  description: Subtask UUIDs in the desired step order.
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Subtask order updated.

  /api/v1/courses/{courseId}/modules/{moduleId}/submodules/{submoduleId}/tasks/{taskId}/subtasks/{subtaskId}:
    parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: moduleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: submoduleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: subtaskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Courses]
      summary: Update a subtask's title
      description: |
        **Admin / Senior Employees.** Corrects the wording or instructions of a subtask checklist item.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  example: "Set up API key from OpenWeatherMap and verify it works"
      responses:
        '200':
          description: Subtask updated.

    delete:
      tags: [Courses]
      summary: Remove a subtask from a task
      description: |
        **Admin / Senior Employees.** Removes a checklist item from a task. Useful when
        simplifying a task or consolidating steps.
      responses:
        '200':
          description: Subtask removed from the task checklist.

  /api/v1/courses/{courseId}/schedule-plan:
    post:
      tags: [Courses]
      summary: Auto-generate a teaching schedule for the entire course
      description: |
        **Admin / Senior Employees.**

        Automatically generates a complete teaching schedule for the course by distributing
        all submodules across calendar days based on their `duration_hours` and the
        `hours_per_day` parameter. Creates scheduled sessions for all assigned instructors.

        **Algorithm:**
        1. Takes all submodules in module/order sequence
        2. Packs them into daily slots of `hours_per_day` hours each
        3. Skips weekends (configurable)
        4. Assigns to instructors based on their course assignments
        5. Saves all sessions visible on the admin/employee daily plans

        **Use case:** A new batch of students starts on August 1st. Admin clicks
        "Auto-Schedule" with start_date=2026-08-01 and hours_per_day=4. The system
        calculates that the 6-month Full Stack course requires ~180 sessions and
        generates all of them on the calendar.
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                start_date:
                  type: string
                  format: date
                  description: The date from which teaching sessions should begin.
                  example: "2026-08-01"
                hours_per_day:
                  type: number
                  description: Maximum teaching hours per day.
                  example: 4
      responses:
        '201':
          description: Complete teaching schedule generated and saved.

  /api/v1/courses/{courseId}/schedule-plan/preview:
    post:
      tags: [Courses]
      summary: Preview the auto-schedule without saving
      description: |
        **Admin / Senior Employees.**

        Runs the same auto-scheduling algorithm as `POST /schedule-plan` but **does not
        save** any sessions to the database. Returns what the schedule would look like
        so the admin can review it before committing.

        **Use case:** Admin wants to see how the schedule would spread across 6 months
        before actually generating it. They preview, adjust `hours_per_day`, preview again,
        and only generate the actual schedule when satisfied.
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                start_date:
                  type: string
                  format: date
                  example: "2026-08-01"
                hours_per_day:
                  type: number
                  example: 4
      responses:
        '200':
          description: Schedule preview returned. Nothing saved to the database.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  total_sessions: 180
                  estimated_end_date: "2026-01-30"
                  sessions_preview:
                    - date: "2026-08-01"
                      submodule: "Variables & Data Types"
                      duration_hours: 2.5
                    - date: "2026-08-01"
                      submodule: "Functions & Scope"
                      duration_hours: 1.5
                message: "Schedule preview generated"
                success: true

  /api/v1/courses/{courseId}/reschedule:
    post:
      tags: [Courses]
      summary: Reschedule all remaining sessions to a new start date
      description: |
        **Admin / Senior Employees.**

        When a course needs to be postponed or restarted, this endpoint shifts all
        **future** (unteaught) scheduled sessions to a new start date, recalculating
        the entire remaining timeline. Past/completed sessions are not affected.

        **Use case:** A batch is delayed by 3 weeks due to Diwali holidays. Admin calls
        reschedule with new_start_date=2026-11-05. All future sessions are shifted
        forward accordingly, preserving the daily hours configuration.
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                new_start_date:
                  type: string
                  format: date
                  description: The new start date from which remaining sessions will be rescheduled.
                  example: "2026-09-01"
      responses:
        '200':
          description: All future sessions rescheduled. Past sessions unchanged.

  /api/v1/courses/{courseId}/schedules:
    post:
      tags: [Courses]
      summary: Manually add a single teaching session to the schedule
      description: |
        **Admin / Senior Employees.**

        Adds one specific teaching session manually — without using the auto-scheduler.
        Useful for adding ad-hoc sessions, make-up classes, or special guest lectures.

        **Use case:** A student batch requested an extra revision session on "Node.js APIs"
        before their assessment. Admin schedules a one-off session for a specific date and
        instructor without affecting the rest of the auto-generated schedule.
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                submodule_id:
                  type: string
                  format: uuid
                  description: Which submodule this session covers.
                instructor_id:
                  type: string
                  format: uuid
                  description: Which employee is teaching this session.
                scheduled_date:
                  type: string
                  format: date-time
                  description: Date and time for the session.
                  example: "2026-08-05T10:00:00Z"
      responses:
        '201':
          description: Manual teaching session added to the schedule.

  /api/v1/courses/{courseId}/schedules/{scheduleId}:
    delete:
      tags: [Courses]
      summary: Remove a scheduled teaching session
      description: |
        **Admin / Senior Employees.**

        Deletes a specific scheduled session. The session will no longer appear on the
        instructor's or admin's daily plan for that date. Use when a session needs to
        be cancelled or rescheduled manually.

        **Use case:** An instructor calls in sick on the day of a scheduled session.
        Admin deletes the session from that day and manually creates a new one
        for the make-up date.
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: scheduleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Session removed from the schedule.

  # ════════════════════════════════════════════
  # Attendance
  # ════════════════════════════════════════════
  /api/v1/attendance:
    post:
      tags: [Attendance]
      summary: Mark attendance for a single user
      description: |
        **Admin / Employee.**

        Records the attendance status for a specific user (student or employee) on a specific date.
        If a record already exists for that user and date, it is updated.

        **Attendance statuses:**
        - `PRESENT` — Full attendance
        - `ABSENT` — Did not attend
        - `LATE` — Arrived after the grace period configured in Settings
        - `HALF_DAY` — Present for only part of the session
        - `ON_LEAVE` — On an approved leave (usually auto-set when a leave is approved)

        **Use case:** An instructor finishes a session and marks a specific student as LATE
        because they joined 30 minutes after the session started.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkAttendanceRequest'
            example:
              user_id: "f9c48f63-7c26-4822-aa54-a9108097e64f"
              date: "2026-07-18"
              status: "LATE"
              note: "Arrived 30 minutes late — transport issue."
      responses:
        '201':
          description: Attendance recorded.
          content:
            application/json:
              example:
                statusCode: 201
                data:
                  id: "att-uuid"
                  user_id: "f9c48f63-7c26-4822-aa54-a9108097e64f"
                  date: "2026-07-18"
                  status: "LATE"
                  note: "Arrived 30 minutes late — transport issue."
                message: "Attendance marked"
                success: true

    get:
      tags: [Attendance]
      summary: Get attendance history with filters
      description: |
        **Admin / Employee / Student.**

        Retrieves attendance records with optional filtering. Role-based access:
        - Admin/Employee: Can view attendance for any user
        - Student: Can only view their own attendance history

        **Use cases:**
        - Student views their own monthly attendance calendar
        - Admin pulls attendance for a specific student to share with parents
        - Admin generates a date-range report for payroll calculations
        - Employee checks attendance for a specific batch before a class
      parameters:
        - name: user_id
          in: query
          schema:
            type: string
            format: uuid
          description: Filter to a specific user's attendance. Admin/Employee only.
        - name: from
          in: query
          schema:
            type: string
            format: date
          description: Start date for the date range filter.
          example: "2026-07-01"
        - name: to
          in: query
          schema:
            type: string
            format: date
          description: End date for the date range filter.
          example: "2026-07-31"
        - name: status
          in: query
          schema:
            type: string
            enum: [PRESENT, ABSENT, LATE, HALF_DAY, ON_LEAVE]
          description: Filter by a specific attendance status (e.g., only show ABSENT records).
      responses:
        '200':
          description: Filtered attendance records.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  - id: "att-uuid-1"
                    user_id: "f9c48f63-7c26-4822-aa54-a9108097e64f"
                    date: "2026-07-01"
                    status: "PRESENT"
                  - id: "att-uuid-2"
                    user_id: "f9c48f63-7c26-4822-aa54-a9108097e64f"
                    date: "2026-07-05"
                    status: "ABSENT"
                message: "Attendance history fetched"
                success: true

  /api/v1/attendance/today:
    get:
      tags: [Attendance]
      summary: Get today's real-time attendance list
      description: |
        **Admin only.**

        Returns the complete, real-time attendance list for the current day — showing every
        student and employee with their current status for today. Entries where attendance
        has not yet been marked show as absent/unmarked.

        **Use case:** Admin opens the "Today's Attendance" dashboard at the start of the day
        to monitor live check-ins. This view updates in real-time as employees check in via
        the check-in endpoint, giving operations staff a live headcount.
      responses:
        '200':
          description: Today's attendance status for all users.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  date: "2026-07-18"
                  employees:
                    - name: "Vikram Singh"
                      status: "PRESENT"
                      check_in_time: "2026-07-18T09:02:00Z"
                    - name: "Priya Shah"
                      status: "ABSENT"
                      check_in_time: null
                  students:
                    - name: "Ananya Patel"
                      status: "PRESENT"
                message: "Today's attendance fetched"
                success: true

  /api/v1/attendance/bulk:
    post:
      tags: [Attendance]
      summary: Mark attendance for multiple users at once
      description: |
        **Admin / Employee.**

        Records attendance for an entire batch of students or the whole staff in a single API call.
        Much more efficient than marking each user individually.

        **Use case:** At the end of a class session, the instructor opens the attendance panel,
        sees the list of all 15 students in the batch, checks/unchecks each one, then submits.
        This endpoint processes all 15 attendance records simultaneously.

        Any user in the `records` array whose attendance for this date was already marked
        will have their record updated (not duplicated).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkAttendanceRequest'
            example:
              date: "2026-07-18"
              records:
                - user_id: "user-uuid-1"
                  status: "PRESENT"
                - user_id: "user-uuid-2"
                  status: "LATE"
                - user_id: "user-uuid-3"
                  status: "ABSENT"
                - user_id: "user-uuid-4"
                  status: "PRESENT"
      responses:
        '200':
          description: Attendance processed for all records in the request.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  processed: 4
                  date: "2026-07-18"
                message: "Bulk attendance marked"
                success: true

  /api/v1/attendance/reports:
    get:
      tags: [Attendance]
      summary: Get aggregated attendance analytics
      description: |
        **Admin / HR Employee.**

        Returns aggregated attendance statistics for a given month — total days, present/absent/late
        counts, and attendance percentage per user. Used for monthly HR review, payroll deduction
        calculations, and parent reporting.

        **Use cases:**
        - HR runs the monthly payroll report to identify employees with attendance below 75%
          (triggering salary deductions per company policy)
        - Admin generates the monthly attendance report to share with student parents
        - Filter by `user_type=STUDENT` for student-only reports, or `EMPLOYEE` for staff

        **Important:** This data directly feeds the payroll deduction calculations.
      parameters:
        - name: month
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 12
          description: Month number (1=January, 12=December).
          example: 7
        - name: year
          in: query
          schema:
            type: integer
          example: 2026
        - name: user_type
          in: query
          schema:
            type: string
            enum: [STUDENT, EMPLOYEE]
          description: Filter report to only students or only employees.
      responses:
        '200':
          description: Monthly attendance analytics per user.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  month: 7
                  year: 2026
                  working_days: 22
                  users:
                    - name: "Vikram Singh"
                      present: 20
                      absent: 1
                      late: 1
                      attendance_percentage: 90.9
                message: "Attendance report fetched"
                success: true

  /api/v1/attendance/check-in:
    post:
      tags: [Attendance]
      summary: Employee self-service check-in
      description: |
        **Employee only.**

        Records the employee's arrival time for the current day. The check-in timestamp
        is compared against the shift start time + grace period (from Settings) to automatically
        determine if the status should be PRESENT or LATE.

        **Use case:** An employee opens the Novox app on their phone, clicks "Check In" when
        they arrive at the office. The system records the timestamp and marks them PRESENT
        (or LATE if they're past the grace period). This appears in the admin's live
        "Today's Attendance" view instantly.

        **Note:** Can only be called once per day. Subsequent calls will update the existing
        check-in time.
      responses:
        '200':
          description: Check-in recorded with computed attendance status.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  check_in_time: "2026-07-18T09:05:00Z"
                  status: "PRESENT"
                  grace_period_minutes: 15
                message: "Check-in recorded"
                success: true

  /api/v1/attendance/check-out:
    post:
      tags: [Attendance]
      summary: Employee self-service check-out
      description: |
        **Employee only.**

        Records the employee's departure time for the current day. The system calculates the
        total hours worked (check-out time - check-in time) and stores it on the attendance record.

        **Use case:** Employee finishes work, opens the Novox app, and clicks "Check Out."
        The system records the time and calculates they worked 9 hours 25 minutes. This data
        is used for overtime tracking and is visible to HR in attendance reports.

        **Prerequisite:** Must have checked in first via `POST /api/v1/attendance/check-in`.
      responses:
        '200':
          description: Check-out recorded. Total hours worked calculated.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  check_out_time: "2026-07-18T18:30:00Z"
                  check_in_time: "2026-07-18T09:05:00Z"
                  hours_worked: 9.4
                message: "Check-out recorded"
                success: true

  # ════════════════════════════════════════════
  # Fees
  # ════════════════════════════════════════════
  /api/v1/fees/plans:
    get:
      tags: [Fees]
      summary: List all student fee plans
      description: |
        **Admin / Employee.**

        Returns all fee plans in the system, optionally filtered by student or course.
        Each fee plan shows the complete fee structure for a student's course enrollment.

        **Use case:** Accounts team opens the "Fee Plans" page to see all active payment
        plans — which students have plans set up, what their monthly installment is,
        and when their plan started. Filter by `student_id` to see all plans for one student.
      parameters:
        - name: student_id
          in: query
          schema:
            type: string
            format: uuid
          description: Show only fee plans for a specific student.
        - name: course_id
          in: query
          schema:
            type: string
            format: uuid
          description: Show only fee plans for a specific course.
      responses:
        '200':
          description: All fee plans matching the filter criteria.

    post:
      tags: [Fees]
      summary: Create a fee plan for a student's course enrollment
      description: |
        **Admin / Employee.**

        Sets up the fee payment structure for a student enrolled in a course. This defines
        how much they pay monthly, what the one-time admission fee is, and the total program cost.

        **`final_fee` calculation:** `total_fee - discount` (auto-calculated server-side)
        **`start_month`/`start_year`:** Defaults to current month/year

        **Typical workflow:**
        1. Student is admitted → `POST /api/v1/students` (create profile)
        2. Student is enrolled → `POST /api/v1/students/{id}/courses` (assign course)
        3. Fee plan is created → `POST /api/v1/fees/plans` ← **this endpoint**
        4. First payment recorded → `POST /api/v1/fees/payments`

        **Use case:** A student is joining the Full Stack course. Accounts creates a fee plan:
        ₹1,25,000 total, ₹5,000 admission fee, ₹10,000/month installments, ₹0 discount.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFeePlanRequest'
      responses:
        '201':
          description: Fee plan created successfully.
          content:
            application/json:
              example:
                statusCode: 201
                data:
                  id: "1c501242-d7f1-47b4-9a0b-cdc039992e60"
                  student_id: "f9c48f63-7c26-4822-aa54-a9108097e64f"
                  total_fee: 125000
                  discount: 0
                  final_fee: 125000
                  admission_fee: 5000
                  monthly_installment: 10000
                  start_month: 6
                  start_year: 2026
                message: "Fee plan created successfully"
                success: true

  /api/v1/fees/plans/{planId}:
    put:
      tags: [Fees]
      summary: Update a fee plan's payment terms
      description: |
        **Admin / Employee.**

        Updates the payment structure of an existing fee plan — typically to revise the
        monthly installment, apply a late discount, or correct an error.

        **Use cases:**
        - Student negotiates a lower monthly installment due to financial hardship → update `monthly_installment`
        - Admin approves a scholarship retroactively → update `discount` (which recalculates `final_fee`)
        - Fee structure was entered incorrectly → correct `total_fee` or `admission_fee`

        **Note:** Updating a fee plan does NOT retroactively modify already-recorded payments.
        It only affects the calculation of future due amounts.
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                monthly_installment:
                  type: number
                  description: Revised monthly payment amount.
                  example: 8000
                discount:
                  type: number
                  description: Updated discount amount (recalculates final_fee automatically).
                  example: 10000
                total_fee:
                  type: number
      responses:
        '200':
          description: Fee plan updated. Future due calculations use the new values.

  /api/v1/fees/plans/{planId}/due-date:
    put:
      tags: [Fees]
      summary: Override the due date for a specific monthly installment
      description: |
        **Admin / Employee.**

        Overrides the standard due date for a specific month's installment. Useful when
        a student has been granted an extension for a particular month.

        **Use case:** A student's July installment is normally due on July 10th, but they
        requested an extension to July 25th due to a family emergency. Accounts grants
        the extension by overriding the due date for that specific month only. The August
        installment returns to the normal schedule.
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [due_date]
              properties:
                due_date:
                  type: string
                  format: date
                  description: The new custom due date for this month's installment.
                  example: "2026-07-25"
                month:
                  type: integer
                  description: The billing month this override applies to.
                  example: 7
                year:
                  type: integer
                  example: 2026
      responses:
        '200':
          description: Due date override applied for the specified month.

  /api/v1/fees/payments:
    get:
      tags: [Fees]
      summary: List all payment transactions
      description: |
        **Admin / Employee.**

        Returns all payment records across all students, optionally filtered by student,
        month, or year. Each record shows the amount, method, and which fee plan it was for.

        **Use case:** Accounts team runs the monthly reconciliation — lists all payments
        received in July 2026 to verify against bank statements and UPI notifications.
        Filter by `month=7&year=2026` to get only July payments.
      parameters:
        - name: student_id
          in: query
          schema:
            type: string
            format: uuid
          description: Show payments for only this student.
        - name: month
          in: query
          schema:
            type: integer
          description: Filter by billing month.
        - name: year
          in: query
          schema:
            type: integer
          description: Filter by billing year.
      responses:
        '200':
          description: List of payment transactions matching the filter.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  - id: "pay-uuid-1"
                    student_name: "Ananya Patel"
                    amount: 10000
                    payment_method: "UPI"
                    payment_type: "INSTALLMENT"
                    month: 7
                    year: 2026
                    paid_at: "2026-07-05T10:30:00Z"
                message: "Payments fetched"
                success: true

    post:
      tags: [Fees]
      summary: Record a new payment from a student
      description: |
        **Admin / Employee.**

        The core fee collection endpoint. Records money received from a student against
        their fee plan.

        **Automatic carry-forward logic:** If a student pays less than the installment amount,
        the shortfall is automatically carried forward — the next month's due amount becomes
        `monthly_installment + previous_shortfall`. If they overpay, the excess credit reduces
        the next month's due.

        **Example:** Student owes ₹10,000 for July but pays only ₹7,000.
        - July balance: -₹3,000 (underpaid)
        - August due: ₹10,000 + ₹3,000 = ₹13,000 (carry-forward applied automatically)

        **Use case:** Accounts receives cash/UPI from a student. They open the payment panel,
        select the student and fee plan, enter the amount received and payment method,
        and record it. The student's outstanding balance updates immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordPaymentRequest'
            example:
              student_id: "f9c48f63-7c26-4822-aa54-a9108097e64f"
              fee_plan_id: "1c501242-d7f1-47b4-9a0b-cdc039992e60"
              amount: 7000
              payment_method: "UPI"
              payment_type: "INSTALLMENT"
              month: 7
              year: 2026
              transaction_reference: "UPI123456789"
      responses:
        '201':
          description: Payment recorded. Carry-forward logic applied automatically.
          content:
            application/json:
              example:
                statusCode: 201
                data:
                  id: "pay-uuid-new"
                  fee_plan_id: "1c501242-d7f1-47b4-9a0b-cdc039992e60"
                  amount: 7000
                  payment_method: "UPI"
                  payment_type: "INSTALLMENT"
                  month: 7
                  year: 2026
                  paid_at: "2026-07-18T16:00:00Z"
                message: "Payment recorded successfully"
                success: true

  /api/v1/fees/payments/{paymentId}:
    parameters:
      - name: paymentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Fees]
      summary: Correct a payment record
      description: |
        **Admin / Employee.**

        Updates an existing payment record to correct errors. Common corrections:
        - Wrong amount was entered (e.g., typed ₹7,000 instead of ₹10,000)
        - Wrong payment method selected
        - Transaction reference ID was not captured at time of recording

        **⚠️ Note:** Changing the amount will affect the carry-forward balance calculations
        for all subsequent months. The balance report (`GET /fees/students/{id}`) will
        reflect the corrected value immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                  description: Corrected payment amount.
                payment_method:
                  type: string
                  enum: [CASH, UPI, CARD, BANK]
                transaction_reference:
                  type: string
                  description: Add/correct the UPI or bank transaction ID.
                notes:
                  type: string
            example:
              amount: 10000
              transaction_reference: "UPI987654321"
              notes: "Correction: original entry had wrong amount."
      responses:
        '200':
          description: Payment record corrected. Balance recalculated.

    delete:
      tags: [Fees]
      summary: Delete an incorrectly recorded payment
      description: |
        **Admin / Employee.**

        Permanently removes a payment record. After deletion, the balance report
        (`GET /fees/students/{id}`) will recalculate as if this payment never happened,
        which will increase the student's outstanding balance.

        **Use case:** A payment was recorded in the wrong student's account. Admin deletes
        the incorrect record and re-records it under the correct student.

        **⚠️ Warning:** This is a permanent deletion. Use with caution — only for data
        entry errors. For refunds, record a negative payment or a note instead.
      responses:
        '200':
          description: Payment record permanently deleted. Balance recalculated.

  /api/v1/fees/balances:
    get:
      tags: [Fees]
      summary: Get outstanding balances for all students
      description: |
        **Admin / Employee.**

        Returns a list of all students with their current outstanding fee balance,
        carry-forward amounts, and overdue status. Balances are calculated dynamically
        in real-time based on all payments recorded vs. the fee plan schedule.

        **Use case:** Accounts team opens the "Outstanding Balances" view at the start
        of each month to see who still owes fees. Students with overdue balances can be
        flagged and contacted. This view is also used to generate the monthly fee collection
        report for management.
      responses:
        '200':
          description: All students with outstanding balance calculations.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  - student_id: "f9c48f63-7c26-4822-aa54-a9108097e64f"
                    name: "Ananya Patel"
                    total_fee: 125000
                    total_paid: 45000
                    outstanding: 80000
                    current_month_due: 13000
                    carry_forward: 3000
                    status: "Partially Paid"
                message: "Student balances fetched"
                success: true

  /api/v1/fees/summary:
    get:
      tags: [Fees]
      summary: Fee collection dashboard summary
      description: |
        **Admin / Employee.**

        Returns aggregate financial statistics for the institute's fee collection performance.
        Used to populate the financial overview cards on the admin dashboard.

        **Metrics returned:**
        - Total fee collected this month
        - Total outstanding balance across all students
        - Number of overdue students
        - Monthly collection target vs. actual
        - Collection rate (% of expected amount actually collected)

        **Use case:** Management opens the finance dashboard at the end of the month
        to see how much was collected, what's outstanding, and the collection rate.
        This informs whether follow-up reminders need to be sent.
      responses:
        '200':
          description: Financial summary statistics for the fee module.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  this_month_collected: 85000
                  total_outstanding: 340000
                  overdue_students: 7
                  monthly_target: 120000
                  collection_rate_percent: 70.8
                message: "Fee summary fetched"
                success: true

  /api/v1/fees/students/{studentId}:
    get:
      tags: [Fees]
      summary: Get complete fee breakdown for a specific student
      description: |
        **Admin / Employee / Student (own data only).**

        Returns a detailed, real-time financial breakdown for a specific student's fee plans.
        This includes the full payment history and the dynamic carry-forward calculation for
        each month's due amount.

        **The `breakdown` object** is dynamically calculated:
        - `totalDue` — Amount that should have been paid up to the current month
        - `totalPaid` — Sum of all payments made so far
        - `remainingBalance` — Total fee still outstanding (`final_fee - totalPaid`)
        - `currentMonthDue` — This month's required payment (installment + any carry-forward shortfall)
        - `carryForward` — Unpaid amount from previous months added to current due
        - `monthsElapsed` — Number of installment months that have passed

        **Use case:**
        - Student opens their "My Fees" page to see exactly how much they owe this month
        - Admin/Accounts opens a student's fee page before following up about an overdue payment
        - Generates the detailed fee statement to share with a student's parents
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: "f9c48f63-7c26-4822-aa54-a9108097e64f"
      responses:
        '200':
          description: Comprehensive fee breakdown with real-time balance calculations.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  student:
                    id: "f9c48f63-7c26-4822-aa54-a9108097e64f"
                    first_name: "Ananya"
                    last_name: "Patel"
                  plans:
                    - id: "1c501242-d7f1-47b4-9a0b-cdc039992e60"
                      course: "Full Stack Web Development"
                      total_fee: 125000
                      final_fee: 125000
                      admission_fee: 5000
                      monthly_installment: 10000
                      start_month: 6
                      start_year: 2026
                      payments:
                        - amount: 5000
                          payment_method: "CASH"
                          payment_type: "ADMISSION"
                          paid_at: "2026-06-01T10:00:00Z"
                        - amount: 7000
                          payment_method: "UPI"
                          payment_type: "INSTALLMENT"
                          paid_at: "2026-06-18T18:59:18Z"
                      breakdown:
                        totalDue: 15000
                        totalPaid: 12000
                        remainingBalance: 113000
                        currentMonthDue: 3000
                        carryForward: 3000
                        monthsElapsed: 1
                      status: "Partially Paid"
                  totalPayments: 2
                message: "Student fee details fetched successfully"
                success: true

  # ════════════════════════════════════════════
  # Leads (CRM)
  # ════════════════════════════════════════════
  /api/v1/leads:
    get:
      tags: [Leads]
      summary: List all CRM leads
      description: |
        **Authenticated users.**

        Returns all leads in the CRM pipeline, enriched with resolved names for the source,
        course interest, and assigned salesperson. Results are ordered by most recently
        added first.

        **Use case:** The sales team opens the CRM board to see all current leads and their
        pipeline stages. They can filter by stage to see only NEW leads (need first contact)
        or PROPOSAL leads (sent pricing, awaiting decision). The `hot` flag highlights
        urgent leads that need immediate follow-up.
      parameters:
        - name: stage
          in: query
          schema:
            type: string
            enum: [NEW, CONTACTED, QUALIFIED, PROPOSAL, CLOSED_WON, CLOSED_LOST]
          description: Filter leads by their current pipeline stage.
        - name: assigned_sales_id
          in: query
          schema:
            type: string
            format: uuid
          description: Show only leads assigned to a specific salesperson.
      responses:
        '200':
          description: Leads list ordered by creation date (newest first).
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  - id: "lead-uuid-1"
                    name: "Rahul Mehta"
                    phone: "+91-9988776655"
                    stage: "NEW"
                    course: "Full Stack Web Development"
                    source: "Instagram"
                    assigneeName: "Priya Shah"
                    hot: false
                    note: "Interested in evening batch"
                    created_at: "2d ago"
                message: "Leads fetched successfully"
                success: true

    post:
      tags: [Leads]
      summary: Add a new lead to the CRM
      description: |
        **Open — can be called from public-facing forms without authentication.**

        Creates a new prospective student record in the CRM pipeline. Designed to be
        called from the institute's website enquiry form, WhatsApp bots, or internal
        lead capture tools.

        **Key feature:** If the `source_name` doesn't exist yet (e.g., "YouTube Ad"),
        it is **automatically created** as a new lead source — no pre-configuration needed.

        **Typical sources:** Instagram, WhatsApp, Walk-in, Website, Referral, Facebook,
        Google Ad, YouTube, Cold Call, etc.

        **Use case 1:** Institute runs an Instagram story ad. Interested users fill in a
        form. Each form submission automatically creates a lead here with `source_name: "Instagram"`.

        **Use case 2:** A walk-in enquiry arrives at the reception. Staff creates the lead
        manually from the CRM panel with `source_name: "Walk-in"`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLeadRequest'
            example:
              name: "Rahul Mehta"
              phone: "+91-9988776655"
              email: "rahul@example.com"
              source_name: "Instagram"
              course_id: "6b53bb61-2de7-403d-b7ac-a53ad6143ad6"
              assigned_sales_id: "emp-uuid-priya"
              stage: "NEW"
              note: "Interested in evening batch. Budget: 1 lakh."
      responses:
        '201':
          description: Lead created and added to the pipeline.

  /api/v1/leads/sources:
    get:
      tags: [Leads]
      summary: Get all lead acquisition channels
      description: |
        **Authenticated users.**

        Returns all lead source options available in the CRM. Used to populate the
        "Source" dropdown when creating a new lead or filtering the pipeline.

        Sources are auto-created when a new `source_name` is used in the create lead endpoint,
        so this list grows organically as new channels are used.

        **Use case:** Sales manager opens the CRM analytics page to see which sources
        are generating the most leads (Instagram? Walk-in? Referral?). This list is also
        used to populate the filter dropdown on the leads board.
      responses:
        '200':
          description: All tracked lead acquisition sources.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  - id: "src-uuid-1"
                    source_name: "Instagram"
                  - id: "src-uuid-2"
                    source_name: "Website"
                  - id: "src-uuid-3"
                    source_name: "Referral"
                  - id: "src-uuid-4"
                    source_name: "Walk-in"
                message: "Lead sources fetched successfully"
                success: true

  /api/v1/leads/performance:
    get:
      tags: [Leads]
      summary: Sales performance leaderboard
      description: |
        **Authenticated users.**

        Returns a breakdown of how many leads each salesperson has been assigned,
        including their initials (for avatar display) and full name. Ordered by lead count.

        **Use case:** Sales manager opens the "Performance" tab in the CRM to see which
        sales employees are handling the most leads. This data powers the leaderboard
        widget and is used for monthly performance reviews to allocate bonuses.

        Note: This counts total leads assigned, not conversion rate. To see conversion rate,
        combine with the `/leads?assigned_sales_id=X&stage=CLOSED_WON` filter.
      responses:
        '200':
          description: Lead count per salesperson.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  - name: "Priya Shah"
                    initials: "PS"
                    count: 24
                  - name: "Arjun Nair"
                    initials: "AN"
                    count: 18
                  - name: "Meera Joshi"
                    initials: "MJ"
                    count: 11
                message: "Performance fetched successfully"
                success: true

  /api/v1/leads/{id}:
    put:
      tags: [Leads]
      summary: Move a lead to a different pipeline stage
      description: |
        **Authenticated users.**

        Updates the stage of a lead, moving it through the sales funnel. This is called
        every time a salesperson completes a step — e.g., after making contact, after sending
        a proposal, or after getting a final decision.

        **Pipeline stages in order:**
        1. `NEW` → Lead just captured, not yet contacted
        2. `CONTACTED` → First call/message made
        3. `QUALIFIED` → Confirmed interest and budget suitability
        4. `PROPOSAL` → Pricing and schedule information sent
        5. `CLOSED_WON` → Student admitted — create their Student record next!
        6. `CLOSED_LOST` → Did not convert — log the reason in activities

        **Use case:** Sales rep Priya calls a lead and they express strong interest.
        She updates the stage from NEW to CONTACTED. After sending fee details,
        she updates to PROPOSAL. When the lead pays the registration fee, she
        updates to CLOSED_WON and creates their Student account.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLeadStageRequest'
            example:
              stage: "CONTACTED"
      responses:
        '200':
          description: Lead stage updated. Pipeline board reflects the new position.

  /api/v1/leads/{id}/activities:
    get:
      tags: [Leads]
      summary: Get the activity/notes history for a lead
      description: |
        **Authenticated users.**

        Returns all logged activities (notes, calls, messages) for a specific lead in
        chronological order. Each activity shows the text, who performed it, and when.

        **Use case:** Sales manager opens a lead's detail panel to review the history
        of all interactions with this prospect — what was discussed in the first call,
        what concerns they raised, what was included in the proposal. This gives full
        context for any follow-up conversation.

        This works like a chat/timeline thread — each note is a timestamped record
        of an action taken with the lead.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Chronological activity log for this lead.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  - id: "act-uuid-1"
                    text: "Initial call — interested in evening batch. Will discuss with family."
                    time: "10:30 AM"
                    sender: "Priya Shah"
                  - id: "act-uuid-2"
                    text: "Sent fee structure and batch schedule via WhatsApp."
                    time: "2:15 PM"
                    sender: "Priya Shah"
                message: "Activities fetched successfully"
                success: true

    post:
      tags: [Leads]
      summary: Log a note or activity on a lead
      description: |
        **Authenticated users.**

        Adds a timestamped note/activity to a lead's history. Used to record any
        interaction with the prospect — phone calls, WhatsApp messages, meetings,
        follow-up actions, etc.

        **Use cases:**
        - Log a call summary: "Called today. Interested but needs to confirm with parents. Follow up next Monday."
        - Record a concern: "Lead concerned about fees — offered EMI option."
        - Track sent material: "Sent brochure and batch schedule via email."
        - Note a no-response: "2nd follow-up — no response. Mark for weekly retry."

        If `performed_by` is not provided, it falls back to the lead's assigned salesperson ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  description: The note or activity description to log.
                  example: "Sent brochure via WhatsApp. Follow up on Monday."
                performed_by:
                  type: string
                  format: uuid
                  description: Employee UUID who performed this activity. Defaults to the lead's assigned salesperson if omitted.
      responses:
        '201':
          description: Activity logged and added to the lead's timeline.

  # ════════════════════════════════════════════
  # Leaves
  # ════════════════════════════════════════════
  /api/v1/leaves:
    post:
      tags: [Leaves]
      summary: Submit a leave application
      description: |
        **All authenticated users (Admin / Employee / Student).**

        Submits a leave request which starts in `PENDING` status until an Admin approves or
        rejects it. The requester's User ID is extracted from their JWT automatically —
        no need to include it in the request body.

        **Leave types:**
        - `SICK` — Medical leave (may require a doctor's note)
        - `CASUAL` — Short-notice personal leave (limited count per year)
        - `EARNED` — Pre-planned paid leave from accrued balance
        - `UNPAID` — Leave without salary for that period (impacts payroll)

        **Use case:** An employee gets sick and applies for 3 days of sick leave from the
        app. Their manager (Admin) sees it in the pending approvals queue. If approved,
        their attendance for those days is automatically marked ON_LEAVE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLeaveRequest'
            example:
              start_date: "2026-08-05"
              end_date: "2026-08-07"
              reason: "Fever and flu — doctor advised 3 days rest."
              leave_type: "SICK"
      responses:
        '201':
          description: Leave application submitted. Now in PENDING status awaiting Admin approval.

    get:
      tags: [Leaves]
      summary: List leave requests
      description: |
        **All authenticated users.**

        Returns leave requests with role-based filtering:
        - **Admin:** Sees all leave requests across all users (for approval dashboard)
        - **Employee/Student:** Sees only their own leave history

        **Use case:**
        - Admin: Opens the "Pending Leaves" view to see all applications awaiting approval
        - Employee: Checks their own leave history and remaining balance
        - Filter `status=PENDING` to see only applications needing a decision
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED]
          description: Filter by approval status.
        - name: user_id
          in: query
          schema:
            type: string
            format: uuid
          description: Admin only — filter to a specific user's leaves.
      responses:
        '200':
          description: Leave requests matching the filter.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  - id: "leave-uuid-1"
                    user_name: "Vikram Singh"
                    start_date: "2026-08-05"
                    end_date: "2026-08-07"
                    leave_type: "SICK"
                    reason: "Fever and flu"
                    status: "PENDING"
                    created_at: "2026-07-18T14:00:00Z"
                message: "Leaves fetched"
                success: true

  /api/v1/leaves/{id}:
    delete:
      tags: [Leaves]
      summary: Cancel / withdraw a leave request
      description: |
        **All authenticated users (own leaves only).**

        Allows a user to cancel their own leave application, **but only if it is still
        in `PENDING` status**. Once approved or rejected, the record cannot be deleted.

        **Use case:** An employee submitted a leave request for the wrong dates. They
        cancel it before the Admin processes it, then resubmit with the correct dates.

        Admin can also delete any leave record for cleanup purposes.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Leave application cancelled and removed.

  /api/v1/leaves/{id}/status:
    put:
      tags: [Leaves]
      summary: Admin approves or rejects a leave request
      description: |
        **Admin only.**

        The Admin's decision endpoint for leave management. Sets the final status of
        a pending leave application.

        **What happens automatically:**
        - `APPROVED` → Attendance records for those dates are updated to `ON_LEAVE` status.
          These days are NOT counted as absent for payroll deduction purposes.
        - `REJECTED` → Attendance records remain `ABSENT` for those dates (or as marked by
          the instructor/admin). The employee/student is expected to attend.

        **Use case:** Admin opens the pending approvals queue, reviews an employee's sick
        leave request, confirms it's valid, and clicks "Approve." The attendance records
        for August 5-7 automatically update to ON_LEAVE.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLeaveStatusRequest'
            example:
              status: "APPROVED"
      responses:
        '200':
          description: Leave decision applied. Attendance records updated automatically.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  id: "leave-uuid-1"
                  status: "APPROVED"
                  approved_at: "2026-07-18T15:00:00Z"
                message: "Leave status updated"
                success: true

  # ════════════════════════════════════════════
  # Payroll
  # ════════════════════════════════════════════
  /api/v1/payroll:
    get:
      tags: [Payroll]
      summary: Get the payroll overview for a month
      description: |
        **Admin / HR Employee.**

        Returns the payroll summary for a given month — showing all employees with their
        calculated gross pay, deductions, and net payable amount. Used to review before
        disbursement.

        **Deductions calculated:**
        - Per-absent-day deduction based on daily rate (monthly salary ÷ working days)
        - LATE attendance: configurable partial deduction
        - UNPAID leave days: full day deduction
        - Only APPROVED leave days (ON_LEAVE) are exempt from deductions

        **Use case:** At the end of the month, HR runs the payroll overview for July 2026.
        They review each employee's net salary, verify deductions are accurate, then
        trigger the payroll processing (see `POST /payroll/process`).
      parameters:
        - name: month
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 12
          example: 7
        - name: year
          in: query
          schema:
            type: integer
          example: 2026
      responses:
        '200':
          description: Payroll summary for the requested month.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  month: 7
                  year: 2026
                  employees:
                    - name: "Vikram Singh"
                      gross_salary: 45000
                      deductions: 2045
                      net_salary: 42955
                      absent_days: 1
                message: "Payroll fetched"
                success: true

  /api/v1/payroll/process:
    post:
      tags: [Payroll]
      summary: Process and finalise payroll for a month
      description: |
        **Admin / HR Employee.**

        Finalises and processes payroll for the specified month. This:
        1. Calculates net salary for each employee based on attendance data
        2. Generates individual payslip records
        3. Marks the payroll as "processed" for that month

        Once processed, employees can view their payslips via `GET /payroll/employee/{id}`.

        **Calculation formula:**
        ```
        Net Salary = Gross Salary - ((Gross / working_days) × absent_days) - UNPAID_leave_deductions
        ```

        **Optional `employee_id`:** Process payroll for only one employee (e.g., a late
        joiner whose payroll was skipped in the main run).

        **Use case:** End of July. HR clicks "Process Payroll" → selects July 2026 → submits.
        12 payslips are generated (one per employee). Employees can immediately view and
        download their payslips from their dashboard.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessPayrollRequest'
            example:
              month: 7
              year: 2026
      responses:
        '200':
          description: Payroll processed. Payslips generated for all employees.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  processed: 12
                  total_disbursed: 540000
                  month: 7
                  year: 2026
                message: "Payroll processed successfully"
                success: true

  /api/v1/payroll/employee/{employeeId}:
    get:
      tags: [Payroll]
      summary: Get payslip history for an employee
      description: |
        **Admin / HR Employee / Employee (own payslips).**

        Returns the list of all generated payslips for a specific employee. Each payslip
        shows the month, gross salary, deductions breakdown, and net amount paid.

        **Role-based access:**
        - Admin/HR: Can view any employee's payslip history (for audits)
        - Employee: Can only view their own payslips

        **Use case:**
        - Employee logs into their dashboard to download their July payslip for tax/loan purposes
        - HR pulls 6 months of payslips for an employee who is applying for a bank loan letter
        - Accounts audits payslips to reconcile with bank transfer records
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: year
          in: query
          schema:
            type: integer
          description: Filter payslips to a specific year.
          example: 2026
      responses:
        '200':
          description: Payslip history for the employee.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  - month: 7
                    year: 2026
                    gross_salary: 45000
                    deductions:
                      absent_deduction: 2045
                      unpaid_leave_deduction: 0
                    net_salary: 42955
                    processed_at: "2026-07-31T17:00:00Z"
                message: "Employee payslips fetched"
                success: true

  # ════════════════════════════════════════════
  # Work Reports
  # ════════════════════════════════════════════
  /api/v1/work-reports:
    post:
      tags: [Work Reports]
      summary: Submit a daily work report
      description: |
        **Admin / Employee.**

        Allows an employee to submit a structured daily work log documenting what they
        accomplished during the day. This creates a transparent, auditable record of
        employee productivity.

        **Use case:** At the end of each working day, employees submit a brief report:
        "Today I completed the fee module integration (3h), reviewed 5 student task
        submissions (2h), and had a mentoring session with Ananya Patel (1h). Total: 6h."

        Admins use these reports for:
        - Daily standup updates
        - Monthly performance reviews
        - Identifying if an employee is consistently underloaded or overloaded
        - Audit trails for project deliverables
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkReportRequest'
            example:
              description: "Completed fee module carry-forward logic. Fixed 3 bugs in attendance report. Code reviewed 2 PRs. Mentoring session with Ananya Patel on React hooks."
              hours_worked: 8
              date: "2026-07-18"
      responses:
        '201':
          description: Work report submitted and logged.

    get:
      tags: [Work Reports]
      summary: List all work reports
      description: |
        **Admin / Employee.**

        Returns work reports with role-based filtering:
        - **Admin:** Can view all employees' reports. Use `employee_id` filter to focus on one person.
        - **Employee:** Can only view their own reports.

        Supports date range filtering for generating weekly/monthly productivity summaries.

        **Use case:**
        - Admin reviews an employee's reports from the past month before their performance review
        - HR checks if an employee has been consistently submitting reports (policy compliance)
        - Employee reviews their own history to prepare for a 1-on-1 meeting
      parameters:
        - name: employee_id
          in: query
          schema:
            type: string
            format: uuid
          description: Admin only — filter to a specific employee's reports.
        - name: from
          in: query
          schema:
            type: string
            format: date
          description: Start date for the report period.
          example: "2026-07-01"
        - name: to
          in: query
          schema:
            type: string
            format: date
          description: End date for the report period.
          example: "2026-07-31"
      responses:
        '200':
          description: Work reports matching the filter.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  - id: "report-uuid-1"
                    employee_name: "Vikram Singh"
                    date: "2026-07-18"
                    description: "Completed fee module carry-forward logic..."
                    hours_worked: 8
                message: "Work reports fetched"
                success: true

  /api/v1/work-reports/{reportId}:
    get:
      tags: [Work Reports]
      summary: Get a single work report by ID
      description: |
        **Admin / Employee.**

        Returns the full details of a specific work report. Used when clicking into
        a report from the list view to read the full description.

        **Use case:** Admin clicks on a specific work report entry to read the full
        description of what the employee did that day, rather than the truncated
        preview shown in the list view.
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Full work report details.

  # ════════════════════════════════════════════
  # Roles & Permissions
  # ════════════════════════════════════════════
  /api/v1/roles:
    get:
      tags: [Roles]
      summary: List all custom roles
      description: |
        **Admin / Employee.**

        Returns all custom roles defined in the system. Custom roles are named permission
        sets that can be assigned to employees to give them fine-grained access beyond
        the three built-in role levels.

        **Use case:** Admin opens the "Roles & Permissions" management page to review what
        custom roles exist and what permissions each grants. Useful for auditing access
        controls.
      responses:
        '200':
          description: All custom roles with their permission sets.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  - id: "role-uuid-1"
                    name: "Content Manager"
                    permissions: ["blogs:read", "blogs:write", "gallery:read", "gallery:write"]
                  - id: "role-uuid-2"
                    name: "Accounts Viewer"
                    permissions: ["fees:read", "payroll:read"]
                message: "Roles fetched"
                success: true

    post:
      tags: [Roles]
      summary: Create a new custom role
      description: |
        **Admin / HR Employee.**

        Creates a named permission set that can be assigned to employees who need access
        to specific modules without being granted full Admin privileges.

        **Use case:** The institute hires a part-time content writer. Rather than making
        them an Admin (which gives too much access), HR creates a "Content Manager" role
        with only blog and gallery write permissions. The writer can publish blogs and
        manage gallery images, but cannot access fee data, payroll, or student records.

        **Example permission strings:**
        - `blogs:read`, `blogs:write`
        - `gallery:read`, `gallery:write`
        - `fees:read`
        - `payroll:read`
        - `students:read`
        - `employees:read`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
            example:
              name: "Content Manager"
              permissions:
                - "blogs:read"
                - "blogs:write"
                - "gallery:read"
                - "gallery:write"
      responses:
        '201':
          description: Custom role created. Can now be assigned to employees.

  /api/v1/roles/{roleId}:
    parameters:
      - name: roleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Roles]
      summary: Update a custom role's permissions
      description: |
        **Admin / HR Employee.**

        Updates the name or permission set of an existing custom role. All employees
        assigned this role will have their effective permissions updated immediately.

        **Use case:** The "Content Manager" role needs to also have access to view student
        profiles (to write personalized success stories). Admin adds `students:read`
        to the role's permission list. All content managers automatically gain this access.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
            example:
              name: "Content Manager"
              permissions:
                - "blogs:read"
                - "blogs:write"
                - "gallery:read"
                - "gallery:write"
                - "students:read"
      responses:
        '200':
          description: Role updated. All users with this role gain the new permissions immediately.

    delete:
      tags: [Roles]
      summary: Delete a custom role
      description: |
        **Admin / HR Employee.**

        Permanently removes a custom role. Employees previously assigned this role
        fall back to their base EMPLOYEE permissions.

        **Use case:** The part-time content writer has left the institute. Their "Content
        Manager" custom role is no longer needed and is deleted to keep the system clean.
      responses:
        '200':
          description: Custom role deleted.

  # ════════════════════════════════════════════
  # Settings
  # ════════════════════════════════════════════
  /api/v1/settings:
    get:
      tags: [Settings]
      summary: Get company-wide operational settings
      description: |
        **Admin / Employee.**

        Returns the institute's operational configuration. These settings are used by
        other modules to make policy-based calculations:

        - `max_leave_days` — Used by the leave module to enforce the annual leave cap
        - `working_hours` — Used for attendance check-in/out and payroll deduction calculations
        - `attendance_grace_minutes` — Employee check-in within this window is marked PRESENT, not LATE
        - `company_name` — Used in email templates, payslip headers, and UI branding

        **Use case:** The leave module checks `max_leave_days` before approving a new
        leave request to ensure the employee hasn't exceeded their annual allowance.
        Employees view settings to know the institute's working hours and attendance policy.
      responses:
        '200':
          description: Current company settings.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  company_name: "Novox EdTech LLP"
                  max_leave_days: 12
                  working_hours: 8
                  attendance_grace_minutes: 15
                message: "Settings fetched"
                success: true

    put:
      tags: [Settings]
      summary: Update company settings
      description: |
        **Admin only.**

        Updates one or more company-wide operational settings. Changes take effect
        immediately for all modules that reference these settings.

        **Use cases:**
        - Increase `max_leave_days` from 12 to 15 for the new financial year
        - Change `attendance_grace_minutes` from 15 to 10 to enforce stricter punctuality
        - Update `company_name` after a rebranding

        **⚠️ Note:** Changing `working_hours` or `attendance_grace_minutes` will affect
        how current-month payroll deductions are calculated. Make these changes at the
        start of a new month to avoid mid-period discrepancies.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                company_name:
                  type: string
                max_leave_days:
                  type: integer
                  description: Maximum paid leave days per year per employee.
                working_hours:
                  type: number
                  description: Standard working hours per day.
                attendance_grace_minutes:
                  type: integer
                  description: Minutes after shift start before arrival is marked LATE.
            example:
              max_leave_days: 15
              attendance_grace_minutes: 10
      responses:
        '200':
          description: Settings updated. Changes apply immediately to all modules.

  # ════════════════════════════════════════════
  # Profile
  # ════════════════════════════════════════════
  /api/v1/profile/me:
    get:
      tags: [Profile]
      summary: Get the logged-in user's own full profile
      description: |
        **All authenticated users.**

        Returns the complete profile of the currently logged-in user. Unlike `GET /auth/me`
        which returns only the auth identity (email, role), this returns the full profile
        with name, phone, address, profile picture, and role-specific details.

        **Role-specific data returned:**
        - Admin: Basic auth identity (no separate profile record)
        - Employee: Full employee HR profile (department, salary, join date)
        - Student: Full student profile (course enrollment, date of birth, address)

        **Use case:** User opens their "My Profile" or "Account Settings" page.
        This single call returns everything needed to render the complete profile view.
      responses:
        '200':
          description: Complete profile for the current user.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  id: "f9c48f63-7c26-4822-aa54-a9108097e64f"
                  email: "ananya@example.com"
                  role: "STUDENT"
                  first_name: "Ananya"
                  last_name: "Patel"
                  phone: "+91-9876543210"
                  profile_pic_url: "https://res.cloudinary.com/novox/image/upload/v123/avatar.jpg"
                  status: "ACTIVE"
                message: "Profile fetched"
                success: true

    put:
      tags: [Profile]
      summary: Update the logged-in user's profile
      description: |
        **All authenticated users.**

        Allows the logged-in user to update their own profile information. Supports
        both JSON fields and an optional `avatar` image file upload via `multipart/form-data`.

        **When uploading an avatar:**
        1. Use `Content-Type: multipart/form-data`
        2. Include the image file as the `avatar` field
        3. The image is uploaded to Cloudinary and the URL is automatically saved to the profile

        **When updating only text fields:**
        Use `Content-Type: application/json` and include only the fields to change.

        **Use case:**
        - Student updates their phone number and address after moving
        - Employee uploads a new profile photo
        - Any user updates their display name
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar:
                  type: string
                  format: binary
                  description: New profile picture image file (JPEG, PNG, WebP).
                first_name:
                  type: string
                  description: Updated first name.
                last_name:
                  type: string
                  description: Updated last name.
                phone:
                  type: string
                  description: Updated phone number.
                address:
                  type: string
                  description: Updated home address (for students).
      responses:
        '200':
          description: Profile updated. If avatar was uploaded, the new URL is returned.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  first_name: "Ananya"
                  phone: "+91-9000000001"
                  profile_pic_url: "https://res.cloudinary.com/novox/image/upload/v456/new-avatar.jpg"
                message: "Profile updated"
                success: true

  # ════════════════════════════════════════════
  # Upload
  # ════════════════════════════════════════════
  /api/v1/upload:
    post:
      tags: [Upload]
      summary: Upload a file to Cloudinary
      description: |
        **All authenticated users.**

        General-purpose file upload endpoint. Uploads any single file (PDF, image, etc.)
        to Cloudinary and returns the hosted URL. This URL can then be used in other
        endpoints that accept document URLs.

        **Supported file types:** Images (JPEG, PNG, WebP, GIF), PDFs, Word docs, Excel files.
        **Maximum file size:** 10MB (as configured in Express JSON limit).

        **Common workflows using this endpoint:**
        1. **Student document:** `POST /upload` → get URL → `POST /students/{id}/documents`
        2. **Employee document:** `POST /upload` → get URL → `POST /employees/{id}/documents`
        3. **Gallery image:** Use the dedicated `POST /gallery/upload` which handles gallery-specific metadata
        4. **Task submission:** `POST /upload` → get URL → `POST /students/{id}/tasks/{taskId}/submit`

        **Use case:** Admin scans a student's admission form as PDF, uploads it here to get
        the Cloudinary URL, then stores it in the student's documents via the student endpoint.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The file to upload. Max 10MB.
      responses:
        '200':
          description: File uploaded to Cloudinary. Use the returned URL in other endpoints.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  url: "https://res.cloudinary.com/novox/raw/upload/v1234/document_abc123.pdf"
                  public_id: "novox/document_abc123"
                  resource_type: "raw"
                  format: "pdf"
                message: "File uploaded successfully"
                success: true

  # ════════════════════════════════════════════
  # Gallery
  # ════════════════════════════════════════════
  /api/gallery:
    get:
      tags: [Gallery]
      summary: List all gallery images (public)
      description: |
        **Public — no authentication required.**

        Returns all images stored in the media gallery, optionally filtered by category
        or website. This endpoint is intended for use on the institute's public website(s)
        to display photo galleries.

        **Use case:** The institute's public website makes a call to this endpoint to
        render the "Photo Gallery" page with all Event photos, or filters by `website_id`
        to only show images for that specific website's gallery.

        Categories (Events, Classroom, Graduation, etc.) allow the website to render
        tabbed gallery sections.
      security: []
      parameters:
        - name: category_id
          in: query
          schema:
            type: string
            format: uuid
          description: Filter to images in a specific category (e.g., only "Events" photos).
        - name: website_id
          in: query
          schema:
            type: string
            format: uuid
          description: Filter to images assigned to a specific website.
      responses:
        '200':
          description: Gallery images matching the filter.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  - id: "img-uuid-1"
                    url: "https://res.cloudinary.com/novox/image/upload/v123/graduation.jpg"
                    title: "Graduation Day 2026"
                    category: "Events"
                    uploaded_at: "2026-07-01T10:00:00Z"
                message: "Gallery images fetched"
                success: true

  /api/gallery/upload:
    post:
      tags: [Gallery]
      summary: Upload a new image to the gallery
      description: |
        **Admin only.**

        Uploads an image file directly to Cloudinary and creates a gallery record with
        metadata (title, category, website). The image is immediately available via
        the `GET /api/gallery` endpoint.

        **Note:** The authentication check happens after the multipart body is fully parsed
        (by design, to prevent EPIPE errors when the request body is streamed). The JWT
        token must still be included in the request.

        **Use case:** Admin uploads photos from the institute's graduation ceremony,
        tags them with `category_id: "Events-uuid"` and `website_id: "main-website-uuid"`,
        so they appear on the main website's gallery page automatically.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: The image file to upload (JPEG, PNG, WebP, GIF).
                title:
                  type: string
                  description: Descriptive title for the image (used as alt text and caption).
                  example: "Graduation Day Celebration - July 2026"
                category_id:
                  type: string
                  format: uuid
                  description: Category this image belongs to.
                website_id:
                  type: string
                  format: uuid
                  description: Website this image should appear on.
      responses:
        '201':
          description: Image uploaded to Cloudinary and gallery record created.

  /api/gallery/bulk-delete:
    post:
      tags: [Gallery]
      summary: Delete multiple gallery images at once
      description: |
        **Admin only.**

        Deletes multiple gallery images in a single request. Each image is deleted from
        both the Cloudinary storage and the database. This is more efficient than deleting
        images one by one.

        **Use case:** After an event, the admin uploaded 50 photos but decides 20 of them
        are low quality and should be removed. They select all 20 in the gallery management
        UI and delete them in one operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  description: Array of gallery image UUIDs to delete.
                  items:
                    type: string
                    format: uuid
                  example: ["img-uuid-1", "img-uuid-2", "img-uuid-3"]
      responses:
        '200':
          description: All specified images deleted from Cloudinary and database.

  /api/gallery/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Gallery]
      summary: Update gallery image metadata
      description: |
        **Admin only.**

        Updates the metadata of an existing gallery image — title, category, or website
        assignment. Does NOT re-upload the image; only updates the descriptive fields.

        **Use case:** An image was uploaded with the wrong category — it was put under
        "Classroom" but should be "Events". Admin corrects the `category_id` without
        needing to re-upload the image.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: Updated image title or caption.
                category_id:
                  type: string
                  format: uuid
                  description: Move image to a different category.
                website_id:
                  type: string
                  format: uuid
                  description: Move image to a different website.
            example:
              title: "Graduation Ceremony — Batch 2026"
              category_id: "events-cat-uuid"
      responses:
        '200':
          description: Image metadata updated.

    delete:
      tags: [Gallery]
      summary: Delete a single gallery image
      description: |
        **Admin only.**

        Permanently deletes the gallery image from both Cloudinary storage and the
        database. This action cannot be undone — the image file is permanently removed
        from Cloudinary.

        **Use case:** A photo was uploaded accidentally (wrong event, identifiable person
        who requested removal, etc.). Admin deletes it from the gallery management panel.
      responses:
        '200':
          description: Image permanently deleted from Cloudinary and database.

  /api/gallery/websites:
    get:
      tags: [Gallery]
      summary: List all website groups for the gallery
      description: |
        **Public — no authentication required.**

        Returns all website groups that the gallery is organized into. Websites allow
        one Novox installation to manage gallery images for multiple websites simultaneously
        (e.g., main institute website + individual branch websites).

        **Use case:** A multi-branch institute uses one Novox dashboard but has separate
        websites for each branch. The gallery is filtered by `website_id` so each website's
        gallery page only shows its own images.
      security: []
      responses:
        '200':
          description: List of website groups.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  - id: "web-uuid-1"
                    name: "Main Website"
                    url: "https://novoxedtech.com"
                  - id: "web-uuid-2"
                    name: "Pune Branch"
                    url: "https://pune.novoxedtech.com"
                message: "Websites fetched"
                success: true

    post:
      tags: [Gallery]
      summary: Create a new website group
      description: |
        **Admin only.**

        Creates a new website group for gallery organization. After creation, images can
        be tagged with this website's ID, and the gallery endpoint can be filtered to
        only return images for that website.

        **Use case:** The institute opens a new branch and launches a new website.
        Admin creates a website entry for it so the new branch's gallery images can be
        organized separately from the main institute's gallery.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: Display name for this website.
                  example: "Mumbai Branch"
                url:
                  type: string
                  format: uri
                  description: The website URL (for reference).
                  example: "https://mumbai.novoxedtech.com"
      responses:
        '201':
          description: Website group created. Images can now be tagged with this website.

  /api/gallery/websites/{id}:
    delete:
      tags: [Gallery]
      summary: Delete a website group
      description: |
        **Admin only.**

        Deletes a website group. Images tagged with this website will have their
        `website_id` set to null but will NOT be deleted.

        **Use case:** A branch website is shut down. Admin removes the website group to
        keep the list clean. The images previously tagged to it remain in the gallery
        but are no longer associated with any website.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Website group deleted. Tagged images are unlinked but not deleted.

  /api/gallery/categories:
    get:
      tags: [Gallery]
      summary: List all gallery categories
      description: |
        **Public — no authentication required.**

        Returns all image categories available in the gallery system. Used to render
        category filter tabs on the gallery page (e.g., "All", "Events", "Classroom",
        "Graduation", "Workshops").

        **Use case:** The website's gallery page loads and calls this endpoint to populate
        the category filter tabs. Then the visitor can click "Events" to filter the gallery
        to only show event photos.
      security: []
      responses:
        '200':
          description: All gallery categories.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  - id: "cat-uuid-1"
                    name: "Events"
                  - id: "cat-uuid-2"
                    name: "Classroom"
                  - id: "cat-uuid-3"
                    name: "Graduation"
                  - id: "cat-uuid-4"
                    name: "Workshops"
                message: "Categories fetched"
                success: true

    post:
      tags: [Gallery]
      summary: Create a new gallery category
      description: |
        **Admin only.**

        Creates a new category for organizing gallery images. After creation, images can
        be tagged with this category when uploading.

        **Use case:** The institute starts hosting hackathons and wants a dedicated
        "Hackathon" category for those photos, separate from the existing "Events" category.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: Category name.
                  example: "Hackathons"
      responses:
        '201':
          description: Gallery category created.

  /api/gallery/categories/{id}:
    delete:
      tags: [Gallery]
      summary: Delete a gallery category
      description: |
        **Admin only.**

        Deletes a gallery category. Images tagged with this category will have their
        `category_id` set to null but will NOT be deleted from the gallery.

        **Use case:** The "Workshops" category is being merged into "Events". Admin
        re-tags all workshop images under "Events" and then deletes the now-empty
        "Workshops" category.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Category deleted. Previously tagged images are uncategorized.

  /api/gallery/storage-usage:
    get:
      tags: [Gallery]
      summary: Get Cloudinary storage usage statistics
      description: |
        **Public (no auth required — but typically called from admin panel).**

        Returns the current Cloudinary storage usage — how much space is being used
        and what the plan's limit is. Helps monitor storage costs and plan capacity.

        **Use case:** Admin checks the storage usage before uploading a large batch of
        photos to ensure they are within the Cloudinary plan limits. Also used to
        decide when it's time to upgrade the Cloudinary plan.
      security: []
      responses:
        '200':
          description: Current Cloudinary storage usage and plan limits.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  used_bytes: 524288000
                  used_human: "500 MB"
                  limit_bytes: 1073741824
                  limit_human: "1 GB"
                  usage_percentage: 48.8
                message: "Storage usage fetched"
                success: true

  # ════════════════════════════════════════════
  # Blogs (AI-powered)
  # ════════════════════════════════════════════
  /api/v1/blogs:
    get:
      tags: [Blogs]
      summary: List all published blog posts
      description: |
        **Authenticated (Admin / Employee).**

        Returns all published blog posts on the connected platform. Ordered by publication date.
        Used to display the blog management list in the admin panel.

        **Use case:** Content manager opens the "Blogs" panel to see all published posts,
        decide what to write next, and manage existing content.
      responses:
        '200':
          description: List of all published blog posts.

  /api/v1/blogs/config:
    get:
      tags: [Blogs]
      summary: Get blog module configuration
      description: |
        **Authenticated.**

        Returns the current configuration for the blog generation module — including
        the connected publishing platform settings and AI model configuration.

        **Use case:** Blog panel loads and calls this to verify the AI and publishing
        integrations are correctly configured before showing the "Generate" button.
      responses:
        '200':
          description: Blog module configuration (platform connection status, AI model info).

  /api/v1/blogs/generate:
    post:
      tags: [Blogs]
      summary: Generate an AI blog draft from a topic
      description: |
        **Authenticated (Admin / Employee).**

        Sends the topic, tone, and keywords to an AI model (e.g., Google Gemini) which
        generates a complete, structured blog post draft. The draft is returned as
        markdown-formatted content ready for editing and publishing.

        **What the AI produces:**
        - SEO-optimized title
        - Full article body with proper headings (H2, H3)
        - Naturally embedded keywords
        - Conclusion with a call-to-action
        - Estimated reading time

        **Use case:** The marketing team wants to publish a blog post about "Why Learn
        React in 2026". They enter the topic, select "educational" tone, add relevant
        keywords, and click generate. Within seconds they have a 1,000-word draft ready
        for final review before publishing.

        **Note:** This only generates the text draft. Use `POST /blogs/generate-image-only`
        for the cover image, then `POST /blogs/publish` to push both to the platform.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlogDraftRequest'
            example:
              topic: "Top 5 Reasons to Learn Full Stack Development in 2026"
              tone: "educational"
              keywords:
                - "full stack development"
                - "React"
                - "Node.js"
                - "career in tech"
                - "web developer salary"
      responses:
        '200':
          description: AI-generated blog draft. Review, edit if needed, then publish.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  title: "Top 5 Reasons to Learn Full Stack Development in 2026"
                  content: "# Introduction\n\nThe demand for full-stack developers has never been higher..."
                  estimated_reading_time: "5 min read"
                message: "Draft generated"
                success: true

  /api/v1/blogs/generate-image-only:
    post:
      tags: [Blogs]
      summary: Generate an AI cover image for a blog post
      description: |
        **Authenticated (Admin / Employee).**

        Uses AI image generation to create a professional cover image based on the blog topic.
        The generated image URL can then be included when publishing the blog post.

        **Use case:** After generating a blog draft, the content manager also wants a
        visually appealing cover image. They call this endpoint with the same topic and
        get back an AI-generated image URL to include in the final published post.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [topic]
              properties:
                topic:
                  type: string
                  description: The blog topic to base the cover image design on.
                  example: "Full Stack Development Career in 2026"
      responses:
        '200':
          description: AI-generated cover image URL ready for use.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  image_url: "https://res.cloudinary.com/novox/image/upload/v123/blog-cover.jpg"
                message: "Cover image generated"
                success: true

  /api/v1/blogs/publish:
    post:
      tags: [Blogs]
      summary: Publish a blog post to the connected platform
      description: |
        **Authenticated (Admin / Employee).**

        Publishes a completed blog post (title, content, cover image) to the configured
        publishing platform (e.g., Google Business Profile, WordPress, Ghost, etc.).

        **Typical workflow:**
        1. `POST /blogs/generate` → Get the AI draft
        2. Edit the draft in the blog editor UI
        3. `POST /blogs/generate-image-only` → Get cover image
        4. `POST /blogs/publish` ← **This step** — publish to the platform

        **Use case:** Content manager reviews the AI-generated blog draft, makes a few
        edits to personalize it, then clicks "Publish." This endpoint pushes the final
        content to the institute's Google Business Profile (or other configured platform),
        making the blog post live for the public.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, content]
              properties:
                title:
                  type: string
                  description: The final blog post title.
                  example: "Top 5 Reasons to Learn Full Stack Development in 2026"
                content:
                  type: string
                  description: The full blog post body in markdown or HTML format.
                cover_image_url:
                  type: string
                  format: uri
                  description: URL of the cover image (from the generate-image-only endpoint or uploaded manually).
                tags:
                  type: array
                  description: SEO tags/categories for the post.
                  items:
                    type: string
                  example: ["web development", "career advice", "React"]
      responses:
        '200':
          description: Blog post published successfully to the configured platform.

  /api/v1/blogs/image:
    get:
      tags: [Blogs]
      summary: Proxy/stream a blog image file
      description: |
        **Authenticated.**

        Streams a blog-related image through the server as a proxy. Used when the blog
        platform stores images at a location that requires server-side proxying (e.g.,
        to avoid CORS issues or to serve images from the backend domain).

        **Use case:** The blog editor UI displays images from the blog platform. Instead
        of fetching directly from the platform (which may have CORS restrictions), images
        are proxied through this endpoint.
      parameters:
        - name: path
          in: query
          schema:
            type: string
          description: The relative path of the image on the blog platform's storage.
      responses:
        '200':
          description: Image binary stream.
          content:
            image/*:
              schema:
                type: string
                format: binary

  /api/v1/blogs/verify-passcode:
    post:
      tags: [Blogs]
      summary: Verify the blog platform passcode
      description: |
        **Authenticated.**

        Verifies a secondary passcode required to perform sensitive blog operations
        (e.g., deleting a published post). Adds an extra layer of security to prevent
        accidental deletion.

        **Use case:** Before showing the "Delete Post" button in the blog manager UI,
        the system prompts for a passcode. This endpoint verifies it before the delete
        action is allowed to proceed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [passcode]
              properties:
                passcode:
                  type: string
                  description: The blog management passcode configured in the system.
      responses:
        '200':
          description: Passcode valid. The requested action is now permitted.

  /api/v1/blogs/{filename}:
    get:
      tags: [Blogs]
      summary: Get a specific blog post's full details
      description: |
        **Authenticated.**

        Fetches the full content and metadata of a specific blog post by its filename/slug.
        Used to load a post into the blog editor for viewing or editing.

        **Use case:** Content manager clicks on "Top 5 Reasons to Learn Full Stack Development"
        in the blog list. This call loads the full post content into the editor view so they
        can review it, copy content, or prepare a follow-up post.
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
          description: The blog post's filename or URL slug.
          example: "top-5-reasons-full-stack-2026"
      responses:
        '200':
          description: Full blog post content and metadata.
          content:
            application/json:
              example:
                statusCode: 200
                data:
                  title: "Top 5 Reasons to Learn Full Stack Development in 2026"
                  content: "# Introduction\n\n..."
                  cover_image_url: "https://res.cloudinary.com/novox/..."
                  published_at: "2026-07-15T10:00:00Z"
                  tags: ["React", "career advice"]
                message: "Blog post fetched"
                success: true

  /api/v1/blogs/{filename}/delete:
    post:
      tags: [Blogs]
      summary: Delete a published blog post
      description: |
        **Authenticated (Admin / Employee).**

        Permanently deletes a published blog post from the connected platform. This action
        is irreversible — the post will no longer be accessible on the public platform.

        **Use case:** A blog post contains outdated information or a factual error that
        cannot be corrected by editing. The content manager deletes it (after verifying
        the passcode via `POST /blogs/verify-passcode`) and can republish a corrected version.

        **Note:** Uses POST method (rather than DELETE) for compatibility with the blog
        platform's webhook architecture.
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
          description: The filename/slug of the blog post to delete.
          example: "top-5-reasons-full-stack-2026"
      responses:
        '200':
          description: Blog post permanently deleted from the platform.
